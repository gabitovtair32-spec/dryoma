<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E131D">
<meta name="color-scheme" content="dark">
<title>Дрёма</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
html,body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&family=Prata&display=swap">
<style>
/* Layout: one phone-width column; label-above-value everywhere; Prata only for headings, all numbers in Commissioner. */
:root{
  --bg:#0E131D; --surface:#151B27; --raise:#1D2433; --line:#262F42; --line-strong:#344058;
  --fg:#ECE8DD; --muted:#8D94A7; --moon:#E3CC94; --moon-soft:rgba(227,204,148,.12); --moon-line:rgba(227,204,148,.45);
  --calm:#8FB8A8; --calm-soft:rgba(143,184,168,.14); --warn:#D69A86; --warn-soft:rgba(214,154,134,.14);
  --f-display:"Prata",Georgia,"Times New Roman",serif;
  --f-body:"Commissioner",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-card:20px; --r-ctl:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--moon);outline-offset:2px}
p{margin:0}

/* shell */
.app{max-width:440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px calc(104px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:40px;margin-bottom:24px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:22px;line-height:1}
.logo-mascot{width:34px;height:34px;display:grid;place-items:center;flex:none}
.logo-mascot svg{width:34px;height:34px}
.plus-badge{height:28px;display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.04em;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.plus-badge.on{border-color:transparent;background:var(--moon-soft);color:var(--moon)}

/* type */
h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:32px 0 12px;line-height:1.3}
.sub{color:var(--muted);margin-top:6px}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:1.45}
.num,.big,.dur,.value{font-variant-numeric:tabular-nums}
.big{font-family:var(--f-body);font-weight:500;font-size:40px;line-height:1.05;letter-spacing:-.02em}
.lbl,.field>label{font-size:13px;color:var(--muted);line-height:1.3}

/* primitives */
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px}
.divide{border-top:1px solid var(--line);margin-top:20px;padding-top:20px}
.badge{display:inline-flex;align-items:center;height:22px;font-size:12px;font-weight:500;padding:0 9px;border-radius:999px;flex:none;white-space:nowrap}
.badge.ok{background:var(--calm-soft);color:var(--calm)}
.badge.low{background:var(--warn-soft);color:var(--warn)}
.primary{width:100%;height:52px;border-radius:16px;background:var(--moon);color:#1A1810;font-weight:600;font-size:16px}
.primary:active{transform:scale(.99)}
.primary:disabled{opacity:.35;cursor:default}
.ghost{height:40px;padding:0 16px;border-radius:12px;background:var(--raise);font-size:14px;font-weight:500}
.link{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.links{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:32px}
.chev{color:var(--muted);flex:none}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.dot.good{background:var(--calm)}.dot.bad{background:var(--warn)}.dot.mid{background:var(--moon)}

/* list rows inside a card */
.rows>*{padding:14px 0;border-top:1px solid var(--line)}
.rows>*:first-child{border-top:0;padding-top:0}
.rows>*:last-child{padding-bottom:0}

/* schedule */
.tpair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbox{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:var(--r-ctl);background:var(--raise);border:1px solid var(--line);cursor:pointer;min-width:0}
.tlab{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);line-height:1.3}
.tlab svg{color:var(--moon);flex:none}
.tbox input[type=time]{height:auto;border-radius:0;background:none;border:0;padding:0;margin:0;font-family:var(--f-body);font-weight:500;font-size:clamp(20px,6.4vw,26px);line-height:1.2;letter-spacing:-.01em;color:var(--fg);width:100%;min-width:0;font-variant-numeric:tabular-nums}
.tbox input[type=time]::-webkit-calendar-picker-indicator{opacity:.4;filter:invert(1)}
.result{margin-top:20px}
.result .lbl{margin-bottom:4px}
.dur{font-weight:500;font-size:36px;line-height:1.1;letter-spacing:-.02em;color:var(--moon)}
.result .small{margin-top:8px}
.vars-title{font-size:15px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;width:100%;padding:12px 16px;border-radius:var(--r-ctl);background:var(--raise);border:1px solid transparent;text-align:left}
.opt[aria-pressed=true]{border-color:var(--moon-line);background:var(--moon-soft)}
.opt-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt-title{display:flex;align-items:center;gap:8px;font-weight:500}
.opt-sub{font-size:13px;color:var(--muted)}
.opt-time{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.opt-time .lbl{font-size:12px}
.opt-time b{font-weight:500;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.opt[aria-pressed=true] .opt-time b{color:var(--moon)}
.foot-note{margin-top:12px}

/* norm */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:999px;background:var(--raise);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--moon-soft);border-color:var(--moon-line);color:var(--moon)}
.norm{margin-top:20px}
.norm .lbl{margin-bottom:4px}
.norm .row{align-items:baseline;gap:10px}
.norm .big{color:var(--calm)}
.norm .small{margin-top:8px}
.why{display:flex;flex-direction:column;gap:14px}
.why>div{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
.why .k{width:28px;height:28px;border-radius:9px;background:var(--raise);display:grid;place-items:center;color:var(--moon)}
.why p{font-size:14px;padding-top:3px}
.why p b{font-weight:500}

/* list buttons */
.item{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.item:hover{border-color:var(--line-strong)}
.item .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--raise);color:var(--moon)}
.item .t{min-width:0;display:flex;flex-direction:column;gap:1px}
.item .t b{font-weight:500}
.item .t span{font-size:13px;color:var(--muted)}
.prompt{background:var(--moon-soft);border-color:rgba(227,204,148,.28);margin-top:20px}
.prompt .ic{background:rgba(227,204,148,.16)}

/* diary */
.form{display:flex;flex-direction:column;gap:20px;margin-top:20px}
.field{display:flex;flex-direction:column;gap:8px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=time],input[type=text],input[type=number],textarea{width:100%;background:var(--raise);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:0 14px;height:48px;font:inherit;font-size:17px;font-variant-numeric:tabular-nums}
textarea{height:auto;padding:12px 14px;font-size:16px;resize:vertical}
.moons{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.moonbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px 10px;border-radius:var(--r-ctl);background:var(--raise);border:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.2}
.moonbtn[aria-pressed=true]{color:var(--moon);border-color:var(--moon-line);background:var(--moon-soft)}
.entry{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start}
.entry .moonic{color:var(--moon);padding-top:1px}
.entry .t{min-width:0}
.entry-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.entry-top b{font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;line-height:22px;padding:0 8px;border-radius:999px;background:var(--raise);color:var(--muted)}
.tag.ex{border:1px dashed var(--line-strong);background:none;line-height:20px}

/* stats */
.score{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.score .big{font-size:52px;color:var(--moon)}
.score-word{margin-top:6px;font-weight:500}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.metric{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.metric .lbl{font-size:12px}
.metric b{font-weight:500;font-size:18px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.chart svg{width:100%;height:auto;display:block}
.chart .small{margin-top:10px}
.insight{display:grid;grid-template-columns:8px 1fr;gap:12px}
.insight b{font-weight:500}
.locked{position:relative;overflow:hidden}
.locked .blur{filter:blur(6px);opacity:.45;pointer-events:none;user-select:none}
.locked .over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;background:linear-gradient(180deg,rgba(21,27,39,.2),rgba(21,27,39,.88))}
.locked .over .ghost{margin-top:4px}

/* chat */
.lockview{text-align:center;padding:32px 20px 20px}
.lockview .halo{width:72px;height:72px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:var(--moon-soft);color:var(--moon)}
.lockview h1{font-size:24px}
.lockview .sub{margin-top:8px}
.feats{display:flex;flex-direction:column;gap:12px;margin:24px 0}
.feat{display:grid;grid-template-columns:16px 1fr;gap:10px;text-align:left;align-items:start}
.feat svg{color:var(--calm);margin-top:3px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-bottom:16px}
.log{display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-line;overflow-wrap:anywhere;line-height:1.5}
.msg.bot{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--moon-soft);border-bottom-right-radius:6px;align-self:flex-end}
.typing{align-self:flex-start;color:var(--muted);font-size:13px;padding:4px 6px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.composer{display:grid;grid-template-columns:1fr 48px;gap:8px;margin-top:16px}
.composer button{height:48px;border-radius:12px;background:var(--moon);color:#1A1810;display:grid;place-items:center}

/* onboarding */
.onb{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto}
.onb .in{max-width:440px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.onb .bar{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;height:40px}
.onb .back{width:36px;height:36px;border-radius:50%;background:var(--raise);display:grid;place-items:center}
.onb .prog{height:4px;border-radius:4px;background:var(--raise);overflow:hidden}
.onb .prog i{display:block;height:100%;background:var(--moon);border-radius:4px;transition:width .3s}
.onb .step{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.onb .body{flex:1;display:flex;flex-direction:column;gap:16px;padding-top:20px}
.onb h1{font-size:26px}
.onb .hint{font-size:14px;color:var(--muted);margin-top:-8px}
.onb .choices{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.onb .choice{width:100%;text-align:left;padding:14px 16px;min-height:52px;border-radius:var(--r-ctl);background:var(--surface);border:1px solid var(--line);font-size:16px;line-height:1.35}
.onb .choice[aria-pressed=true]{border-color:var(--moon-line);background:var(--moon-soft);color:var(--moon)}
.onb .choice.own{border-style:dashed;color:var(--muted)}
.onb .choice.own[aria-pressed=true]{color:var(--moon);border-style:solid}
.onb .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.onb .unit{position:relative}
.onb .unit input{padding-right:44px}
.onb .unit span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.onb input[type=text]{margin-top:8px}
.onb input.timein{margin-top:8px;height:64px!important;font-size:30px!important;font-weight:500;text-align:left}
.onb .foot{display:flex;flex-direction:column;gap:4px;padding-top:24px}
.onb .skip{height:44px;color:var(--muted);font-size:14px}
.onb .body>h2{margin:16px 0 0}
.hero-moon{width:88px;height:88px;margin:0 auto 12px;color:var(--moon)}
.res-norm{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.res-norm .big{font-size:44px;color:var(--calm)}
.plan-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plan-row>div{display:flex;flex-direction:column;gap:2px}
.plan-row>div:nth-child(2){align-items:center}
.plan-row>div:last-child{align-items:flex-end}
.plan-row b{font-weight:500;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.note-row{display:grid;grid-template-columns:8px 1fr;gap:12px;font-size:14px}
.ai-card{background:linear-gradient(180deg,var(--moon-soft),transparent 75%),var(--surface)}
.ai-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--moon);margin-bottom:12px}
.ai-text{white-space:pre-line;font-size:14px;line-height:1.6}

/* mascot */
:root{--fur:#EAD5A2;--fur-shade:#CDB176;--fur-line:#A98C55;--ear:#EDB4A0;--ink:#231C12;--nose:#C98B7A;--blush:#E9A68E;--st-wake:#D69A86;--st-rem:#E3CC94;--st-n1:#3B4762;--st-n2:#62728E;--st-n3:#8FB8A8}
.drema{display:block;overflow:visible}
.drema .bob{transform-origin:32px 56px;animation:bob 4.5s ease-in-out infinite}
.drema .zz{animation:zz 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.drema .zz.z2{animation-delay:1.2s}
.drema .breathe{transform-origin:56px 56px;animation:bob 3.6s ease-in-out infinite}
.mascot{display:block;padding:0;line-height:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.mascot:focus-visible{outline:2px solid var(--moon);outline-offset:2px;border-radius:12px}
.nap{position:absolute;z-index:2}
.nap svg{display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.nap-r{right:16px}
.has-nap{position:relative}
.plus-wrap{position:relative;display:inline-block}
.plus-wrap .badge-cat{position:absolute;right:6px;bottom:calc(100% - 9px)}
.drema .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
.drema .ear{transform-box:fill-box;transform-origin:50% 100%;animation:twitch 8s infinite}
.drema .ear-r{animation-duration:9.5s}
.drema .head.flat .ear-l{animation:none;transform:rotate(-26deg)}
.drema .head.flat .ear-r{animation:none;transform:rotate(26deg)}
.drema .tail{transform-box:fill-box;transform-origin:0% 50%;animation:swish 3.2s ease-in-out infinite}
.drema .vein{animation:pulse .6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes twitch{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-9deg)}94%{transform:rotate(4deg)}}
@keyframes swish{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.hop{animation:hop .45s ease-out}
.shake{animation:shake .4s ease-in-out 2}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-7px) scale(1.04)}70%{transform:translateY(1px)}100%{transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px) rotate(-3deg)}40%{transform:translateX(4px) rotate(3deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.speech{position:fixed;left:0;top:0;z-index:70;will-change:transform;max-width:min(260px,calc(100vw - 16px));background:var(--fg);color:#141821;font-size:14px;line-height:1.4;font-weight:500;padding:10px 13px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);pointer-events:none;opacity:0;visibility:hidden;transition:opacity .16s,visibility 0s .16s}
.speech.show{opacity:1;visibility:visible;transition:opacity .16s}
.speech::after{content:"";position:absolute;left:calc(var(--ax,50%) - 7px);top:100%;border:7px solid transparent;border-top-color:var(--fg)}
.speech.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--fg)}
@keyframes bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.985)}}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}40%{opacity:1}100%{opacity:0;transform:translate(3px,-6px)}}
.say{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:end;margin-top:20px}
.say .av{width:56px;height:56px}
.hero-drema .mascot{margin:0 auto}
.say .bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 14px}
.say .who{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--moon);margin-bottom:2px}
.say p{font-size:14px;line-height:1.5}
.card .say{margin-top:0}
.hero-drema{width:120px;height:120px;margin:0 auto 12px}
/* learn */
.hypno svg{width:100%;height:auto;display:block;font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.stage{display:grid;grid-template-columns:10px 1fr auto;gap:4px 12px;align-items:baseline}
.stage i{width:10px;height:10px;border-radius:3px;align-self:center}
.stage b{font-weight:500}
.stage .share{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage p{grid-column:2 / 4;font-size:14px;color:var(--muted)}
.thead{display:grid;grid-template-columns:1fr auto;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.cbar{display:flex;height:22px;border-radius:7px;overflow:hidden;gap:2px}
.cbar span{display:block;height:100%}
.cbar-row{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center}
.cbar-row+.cbar-row{margin-top:10px}
.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:10px 0;text-align:right;border-bottom:1px solid var(--line);font-size:14px}

.cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--fg)}
.cmp tr:last-child td{border-bottom:0}
.cmp .loss{color:var(--warn);font-weight:500}
.cmp .keep{color:var(--calm);font-weight:500}
.risk{display:grid;grid-template-columns:96px 1fr;gap:12px;font-size:14px}

.myth .tagline.t{color:var(--calm);margin-top:12px}
.myth b{font-weight:500;font-size:16px}
.myth p{font-size:14px}
.src{font-size:12px;color:var(--muted);margin-top:24px}
.scene{width:100%;max-width:320px;margin:-8px auto 0}
.scene svg{width:100%;height:auto;display:block}
.drema .wave{transform-box:fill-box;transform-origin:50% 100%;animation:wave .9s ease-in-out infinite alternate}
.drema .rollx{animation:rollx 2.8s ease-in-out infinite alternate}
.drema .spin{transform-box:fill-box;transform-origin:center;animation:spin 2.8s ease-in-out infinite alternate}
.drema .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 2.4s ease-in-out infinite}
.drema .tapA{animation:tap .32s ease-in-out infinite alternate}
.drema .tapB{animation:tap .32s ease-in-out .16s infinite alternate}
.drema .run{animation:run 4.2s linear infinite}
.drema .bobfast{animation:bobfast .3s ease-in-out infinite alternate}
.drema .legA,.drema .legB{transform-box:fill-box;transform-origin:50% 0}
.drema .legA{animation:leg .3s ease-in-out infinite alternate}
.drema .legB{animation:leg .3s ease-in-out -.3s infinite alternate-reverse}
.drema .dust{animation:dust .6s ease-out infinite}
.drema .dust.d2{animation-delay:.3s}
.drema .ring{transform-box:fill-box;transform-origin:50% 50%;animation:ringshake .12s linear infinite alternate}
.drema .ringl{animation:blinkl .5s steps(2) infinite}
.drema .steam{animation:steam 2.2s ease-in-out infinite}
.drema .steam.s2{animation-delay:1.1s}
.drema .snore{transform-box:fill-box;transform-origin:100% 50%;animation:snore 3s ease-in-out infinite}
.drema .bounce{animation:bounce 1s cubic-bezier(.3,0,.6,1) infinite alternate}
.drema .shadow{transform-box:fill-box;transform-origin:center;animation:shadow 1s cubic-bezier(.3,0,.6,1) infinite alternate}
@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(22deg)}}
@keyframes rollx{from{transform:translateX(0)}to{transform:translateX(110px)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(540deg)}}
@keyframes grow{0%,100%{transform:scaleY(1)}50%{transform:scale(.97,1.16)}}
@keyframes tap{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes run{from{transform:translate(-40px,76px)}to{transform:translate(340px,76px)}}
@keyframes bobfast{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes leg{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
@keyframes dust{from{opacity:.5;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(-10px,-4px) scale(1.8)}}
@keyframes ringshake{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes blinkl{0%{opacity:1}100%{opacity:0}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-10px)}}
@keyframes snore{0%,100%{transform:scale(.4)}60%{transform:scale(1.6)}}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-42px)}}
@keyframes shadow{from{transform:scale(1);opacity:.35}to{transform:scale(.45);opacity:.15}}
@media (prefers-reduced-motion:reduce){.drema .wave,.drema .rollx,.drema .spin,.drema .grow,.drema .tapA,.drema .tapB,.drema .bobfast,.drema .legA,.drema .legB,.drema .dust,.drema .ring,.drema .ringl,.drema .steam,.drema .snore,.drema .bounce,.drema .shadow{animation:none}.drema .run{animation:none;transform:translate(150px,76px)}}
@media (prefers-reduced-motion:reduce){.drema .bob,.drema .zz,.drema .breathe,.drema .eyes,.drema .ear,.drema .tail,.drema .vein,.hop,.shake{animation:none}}

.sky{position:fixed;left:0;right:0;top:0;height:300px;pointer-events:none;z-index:0;overflow:hidden;-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}

.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}

@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.75}}

@keyframes rise{from{transform:translateY(10px)}to{transform:translateY(-12px)}}

.gear{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--raise)}

.set-block{display:flex;flex-direction:column;gap:10px;margin-top:20px}

select{width:100%;height:48px;background:var(--raise);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:0 12px;font:inherit;font-size:16px}

main section:not([hidden]){animation:fadeUp .3s ease-out}

.item,.snd,.opt,.chip,.moonbtn,.primary,.ghost{transition:transform .12s,background-color .15s,border-color .15s}

.sounds{grid-template-columns:1fr 1fr}

.pet-hint{font-size:13px;color:var(--muted)}
.heart{position:absolute;pointer-events:none;transform:translate(-50%,-50%);animation:heart 1.3s ease-out forwards}
@keyframes heart{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-260%) scale(.8)}}
.card.kind{text-align:center;padding:24px 20px;margin-top:12px}
.kind-text{font-family:var(--f-display);font-size:21px;line-height:1.4;margin:12px 0 18px;text-wrap:balance;min-height:3em}
.kind-text.fadein{animation:fadeUp .5s ease-out}
.worry{display:flex;flex-direction:column;gap:12px}
.worry textarea{transition:transform .9s cubic-bezier(.5,0,.75,0),opacity .9s}
.worry textarea.fly{transform:translate(40px,-260px) scale(.15) rotate(-25deg);opacity:0}
.ground .g-step{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center}
.g-n{font-size:40px;font-weight:600;color:var(--calm);text-align:center}
.g-step p{font-size:15px}
.g-dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.g-dots i{width:7px;height:7px;border-radius:50%;background:var(--raise)}
.g-dots i.on{background:var(--calm)}
.ground .ghost,.good .ghost{width:100%;margin-top:4px}
.ground>.small{margin-bottom:12px}
.g-done{display:flex;gap:10px;align-items:center;color:var(--calm);margin-bottom:12px;font-weight:500}
.good{display:flex;flex-direction:column;gap:10px}
.good-list{display:flex;flex-direction:column;gap:8px}
.good-list div{display:grid;grid-template-columns:16px 1fr;gap:10px;align-items:start}
.good-list svg{color:var(--calm);margin-top:3px}
.calm-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}
.calm-btns .ghost{height:44px}
.calm-safe{text-align:center;margin-top:20px}
.worry-list .wl p{font-size:15px}
.wl-btns{display:flex;gap:8px;margin-top:10px}
.wl-btns .ghost{flex:1;height:36px;font-size:13px}
/* mixer, review, wardrobe */
.mixseg{margin:0 0 10px}
.mixvols{display:flex;flex-direction:column;gap:4px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mixvols .vol{margin-top:0}
.review{background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px;min-height:120px}
.wardrobe{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wr{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:var(--raise);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.wr.on{border-color:var(--moon-line);background:var(--moon-soft);color:var(--moon)}
.wr-av{width:52px;height:52px}
.wr-lock{position:absolute;top:8px;right:8px;color:var(--muted)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(14,19,29,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;height:60px;justify-content:center;font-size:11px;font-weight:500;color:var(--muted);position:relative}
nav.tabs button[aria-current=page]{color:var(--moon)}
nav.tabs .pdot{position:absolute;top:10px;left:calc(50% + 9px);width:7px;height:7px;border-radius:50%;background:var(--moon);border:2px solid var(--bg);box-sizing:content-box}

/* sheet, overlay, toast */
.scrim{position:fixed;inset:0;z-index:48;background:rgba(5,8,14,.62);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:24px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));animation:up .28s ease-out}
.sheet-title{font-family:var(--f-display);font-size:24px;line-height:1.2}
.price-row{display:flex;align-items:baseline;gap:8px;margin:16px 0 4px}
.price{font-weight:500;font-size:36px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sheet .feats{margin:20px 0 24px}
.sheet .small{text-align:center;margin-top:12px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.breath{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:max(24px,env(safe-area-inset-top,0px)) 24px max(24px,env(safe-area-inset-bottom,0px))}
.orb{width:220px;height:220px;max-width:70vw;max-height:70vw;border-radius:50%;display:grid;place-items:center;position:relative}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 45%,rgba(227,204,148,.38),rgba(227,204,148,.08) 62%,transparent 72%);transform:scale(var(--s,.55));transition:transform var(--d,1s) ease-in-out}
.orb b{position:relative;font-weight:300;font-size:52px;font-variant-numeric:tabular-nums}
.phase{font-size:20px;min-height:30px;text-align:center}
.close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:50%;background:var(--raise);display:grid;place-items:center}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--raise);border:1px solid var(--line-strong);padding:10px 16px;border-radius:999px;font-size:14px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.orb::before,.onb .prog i{transition:none}.sheet{animation:none}}

<script>
(function(){
const APP = 'Дрёма';
const BETA = true;
const AI_ON = !!(window.claude && window.claude.use);
const tg = window.Telegram && window.Telegram.WebApp;
document.title = APP; document.getElementById('appname').textContent = APP;
if (tg) { try {
  tg.ready(); tg.expand();
  if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')){ tg.setHeaderColor('#0E131D'); tg.setBackgroundColor('#0E131D'); }
  if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.10') && tg.setBottomBarColor) tg.setBottomBarColor('#0E131D');
  if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) tg.disableVerticalSwipes();
} catch(e){} }

/* ---------- data ---------- */
const KEY = 'drema-proto-v1';
const LAT = {'<15':10,'15–30':22,'30–60':45,'>60':75};
const LAT_LABEL = {'<15':'до 15 мин','15–30':'15–30 мин','30–60':'30–60 мин','>60':'больше часа'};
const FACTORS = ['Кофе после 16:00','Алкоголь','Спорт','Телефон в кровати','Стресс','Поздний ужин'];
const QWORD = ['','Ужасно','Плохо','Средне','Хорошо','Отлично'];
const TIPS = [
  'Последняя чашка кофе — до 15:00. Кофеин держится в организме 5–6 часов.',
  'Прохладная спальня, около 18–20 °C, помогает быстрее уснуть.',
  'Вставайте в одно и то же время даже в выходные. Это главный якорь режима.',
  'Утренний свет в первые полчаса после подъёма помогает вечером захотеть спать вовремя.',
  'Не можете уснуть минут 20? Встаньте и займитесь чем-то спокойным при тусклом свете.',
  'Кровать — только для сна. Сериалы и ленту лучше оставить для дивана.',
  'Алкоголь помогает отключиться, но делает вторую половину ночи поверхностной.'
];

function iso(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
let TZ = '';
function tzNow(){
  if (!TZ) return new Date();
  try {
    const p = new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
    const g = t => +p.find(x=>x.type===t).value;
    return new Date(g('year'), g('month')-1, g('day'), g('hour'), g('minute'), g('second'));
  } catch(e){ return new Date(); }
}
function daysAgo(n){ const d=tzNow(); d.setDate(d.getDate()-n); return iso(d); }
let TODAY = iso(new Date());
const PHASE_NAME = {morning:'Утро', day:'День', evening:'Вечер', night:'Ночь'};
function phaseOf(h){ return h>=5&&h<11 ? 'morning' : h<17&&h>=11 ? 'day' : h>=17&&h<22 ? 'evening' : 'night'; }
function curPhase(){ return (typeof S!=='undefined' && S.phase) || phaseOf(tzNow().getHours()); }

function seed(){
  const s = [
    [21,'23:50','07:05','15–30','1',3,['Телефон в кровати']],
    [20,'00:30','07:00','30–60','2',2,['Кофе после 16:00']],
    [19,'23:20','07:00','<15','0',4,['Спорт']],
    [18,'00:10','07:10','15–30','1',3,['Телефон в кровати','Стресс']],
    [17,'01:00','07:00','>60','2',1,['Кофе после 16:00','Телефон в кровати']],
    [16,'23:40','08:30','15–30','1',3,['Алкоголь']],
    [15,'00:20','09:00','15–30','2',3,['Алкоголь','Поздний ужин']],
    [14,'23:30','07:00','15–30','1',3,['Телефон в кровати']],
    [13,'23:10','07:05','<15','0',4,['Спорт']],
    [12,'00:40','07:00','30–60','2',2,['Кофе после 16:00','Стресс']],
    [11,'23:25','07:00','15–30','1',3,[]],
    [10,'23:15','07:10','<15','1',4,['Спорт']],
    [9,'23:50','07:00','15–30','1',3,['Телефон в кровати']],
    [8,'00:30','08:40','30–60','2',2,['Алкоголь','Поздний ужин']],
    [6,'23:40','07:05','15–30','1',3,['Телефон в кровати']],
    [5,'00:50','07:00','30–60','2',2,['Кофе после 16:00','Телефон в кровати']],
    [4,'23:15','07:10','<15','0',4,['Спорт']],
    [3,'01:20','07:00','>60','2',1,['Кофе после 16:00','Стресс','Телефон в кровати']],
    [2,'23:30','07:05','15–30','1',3,['Телефон в кровати']],
    [1,'23:05','07:00','<15','0',5,['Спорт']]
  ];
  return s.map(r=>({date:daysAgo(r[0]),bed:r[1],wake:r[2],lat:r[3],wakes:r[4],q:r[5],f:r[6],demo:true}));
}
function freshState(){ return {entries:[], premium:true, wake:'07:00', chat:[], opts:null, assess:{step:-1,a:{}}, seedV:2, course:{done:[]}, range:'week', sTimer:30, vol:.6}; }
let S = freshState();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e){}
if (S.seedV !== 2){ const mine = (S.entries||[]).filter(e=>!e.demo), md = new Set(mine.map(e=>e.date)); S.entries = seed().filter(e=>!md.has(e.date)).concat(mine); S.seedV = 2; }
TZ = S.tz || ''; TODAY = iso(tzNow());
if (BETA) S.premium = true;
S.course = S.course || {done:[]}; S.range = S.range || 'week'; S.sTimer = S.sTimer || 30; if (S.vol == null) S.vol = .6;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} cloudSave(); }
/* Telegram CloudStorage backup: values are limited to 4096 chars, so the state is split into chunks */
const CS = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') ? tg.CloudStorage : null;
let cloudT = null;
function cloudSave(){
  if (!CS) return; clearTimeout(cloudT);
  cloudT = setTimeout(()=>{ try {
    const keep = Object.assign({}, S, {chat:(S.chat||[]).slice(-30)});
    const str = JSON.stringify(keep), parts = [];
    for (let i=0;i<str.length;i+=3800) parts.push(str.slice(i,i+3800));
    parts.forEach((p,i)=>CS.setItem('s'+i, p, ()=>{}));
    CS.setItem('sn', String(parts.length), ()=>{});
  } catch(e){} }, 1500);
}
function cloudWipe(){ if (!CS) return; try { CS.getKeys((err, keys)=>{ if (!err && keys && keys.length) CS.removeItems(keys, ()=>{}); }); } catch(e){} }
function cloudLoad(done){
  if (!CS) return done(null);
  try { CS.getItem('sn', (err, n)=>{ n = parseInt(n,10); if (err || !n) return done(null);
    const keys = Array.from({length:n}, (_,i)=>'s'+i);
    CS.getItems(keys, (e2, vals)=>{ if (e2 || !vals) return done(null); try { done(JSON.parse(keys.map(k=>vals[k]||'').join(''))); } catch(x){ done(null); } });
  }); } catch(e){ done(null); }
}

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
function esc(t){ return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function fmtTime(m){ m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function fmtDur(m){ m=Math.round(m); const h=Math.floor(m/60), r=m%60; return r ? h+' ч '+r+' мин' : h+' ч'; }
function fmtShort(m){ m=Math.round(m); return Math.floor(m/60)+'ч '+String(m%60).padStart(2,'0')+'м'; }
function dec(x){ return x.toFixed(1).replace('.',','); }
function inBed(e){ return (toMin(e.wake)-toMin(e.bed)+1440)%1440; }
function sleepMin(e){ return Math.max(0, inBed(e) - LAT[e.lat] - parseInt(e.wakes)*10); }
function norm(){ return ({'14–17 лет':[8,10],'18–64 года':[7,9],'65 и старше':[7,8]})[S.age||'18–64 года'] || [7,9]; }
function scoreOf(e){
  const h = sleepMin(e)/60, [lo,hi] = norm();
  const dur = h>=lo && h<=hi ? 40 : Math.max(0, 40 - Math.abs(h<lo ? lo-h : h-hi)*16);
  const lat = {'<15':15,'15–30':10,'30–60':5,'>60':0}[e.lat];
  const wk = [15,10,5,0][Math.min(3,parseInt(e.wakes))];
  return Math.round(dur + e.q/5*30 + lat + wk);
}
function bedNorm(e){ const m=toMin(e.bed); return m<720 ? m+1440 : m; }
function sorted(){ return S.entries.slice().sort((a,b)=>a.date<b.date?-1:1); }
function last7(){ return sorted().slice(-7); }
function lastN(n){ return sorted().slice(-n); }
function avg(a){ return a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0; }
function stats(n, L){
  L = L || lastN(n||7); if (!L.length) return null;
  const beds = L.map(bedNorm), mb = avg(beds);
  const sd = Math.sqrt(avg(beds.map(b=>(b-mb)**2)));
  return { n:L.length, sleep:avg(L.map(sleepMin)), score:Math.round(avg(L.map(scoreOf))),
    lat:avg(L.map(e=>LAT[e.lat])), spread:Math.round(sd), bed:mb, q:avg(L.map(e=>e.q)) };
}
function insights(n){
  const L = lastN(n||7), out = [];
  FACTORS.forEach(f=>{
    const w = L.filter(e=>e.f.includes(f)), wo = L.filter(e=>!e.f.includes(f));
    if (w.length && wo.length){
      const d = avg(w.map(e=>e.q)) - avg(wo.map(e=>e.q));
      if (Math.abs(d) >= 0.5) out.push({f, d, n:w.length});
    }
  });
  out.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));

}

let deck = [];
function nextPhrase(){ if (!deck.length) deck = PHRASES.map((_,i)=>i).sort(()=>Math.random()-.5); return PHRASES[deck.pop()]; }
const pick = a => a[Math.random()*a.length|0];
let speechEl = null, speechT = null, speechFor = null, speechRaf = 0;
function placeSpeech(){
  speechRaf = 0;
  if (!speechEl || !speechFor || !speechEl.classList.contains('show')) return;
  if (!document.body.contains(speechFor)){ speechEl.classList.remove('show'); return; }
  const r = speechFor.getBoundingClientRect(), w = speechEl.offsetWidth, h = speechEl.offsetHeight, cx = r.left + r.width/2;
  const left = Math.max(8, Math.min(innerWidth - w - 8, cx - w/2));
  let top = r.top - h - 10, below = false;
  if (top < 8){ top = r.bottom + 10; below = true; }
  speechEl.classList.toggle('below', below);
  speechEl.style.transform = `translate(${left}px, ${top}px)`;
  speechEl.style.setProperty('--ax', (cx-left)+'px');
}
function queueSpeech(){ if (!speechRaf) speechRaf = requestAnimationFrame(placeSpeech); }
addEventListener('scroll', queueSpeech, {passive:true, capture:true});
addEventListener('resize', queueSpeech, {passive:true});
function speak(el, text, ms){
  if (!speechEl){ speechEl = document.createElement('div'); speechEl.className='speech'; speechEl.setAttribute('role','status'); document.body.appendChild(speechEl); }
  speechFor = el;
  speechEl.textContent = text;
  speechEl.classList.remove('show'); void speechEl.offsetWidth;
  speechEl.classList.add('show');
  placeSpeech();
  clearTimeout(speechT); speechT = setTimeout(()=>{ speechEl.classList.remove('show'); speechFor = null; }, ms||2800);
}
function onMascot(m){
  const now = Date.now();
  if (m.dataset.kind==='scene'){
    m.classList.remove('hop'); void m.offsetWidth; m.classList.add('hop');
    speak(m, pick(SCENE_LINES[m.dataset.scene]||PHRASES), 2400); return;
  }
  if (m.dataset.kind==='pose'){
    const w = +m.dataset.w, name = m.dataset.pose;
    m._pokes = (now - (m._last||0) < 5000) ? (m._pokes||0)+1 : 1; m._last = now;
    const face = m._pokes===1 ? 'drowsy' : m._pokes===2 ? 'grumpy' : 'angry';
    m.innerHTML = pose(name, face, w);
    m.classList.remove('shake','hop'); void m.offsetWidth; m.classList.add(face==='angry'?'shake':'hop');
    speak(m, pick(POKE[face]), 2200);
    clearTimeout(m._t);
    m._t = setTimeout(()=>{ m.innerHTML = pose(name,'sleep',w); m._pokes = 0; m.classList.remove('shake','hop'); if (document.body.contains(m)) speak(m, face==='angry'?'Хр-р… (обиделся и уснул)':'Хр-р…', 1400); }, face==='angry'?3000:2600);
    return;
  }
  const size = +m.dataset.size, mood = m.dataset.mood;
  m._taps = (now - (m._last||0) < 1600) ? (m._taps||0)+1 : 1; m._last = now;
  const tickled = m._taps >= 5;
  m.innerHTML = drema(tickled ? 'grumpy' : 'happy', size);
  m.classList.remove('hop','shake'); void m.offsetWidth; m.classList.add(tickled?'shake':'hop');
  speak(m, tickled ? 'Ой, щекотно! Ну хватит!' : nextPhrase());
  clearTimeout(m._t); m._t = setTimeout(()=>{ m.innerHTML = drema(mood,size); m.classList.remove('hop','shake'); if (tickled) m._taps = 0; }, tickled?1800:1100);
}

function stageTotals(limit){

function hypnoSVG(){
  const X0=66, X1=330, Y0=18, step=28, total=450;
  const x = m => X0 + m/total*(X1-X0), y = k => Y0 + STAGE[k].y*step;
  let s = `<svg viewBox="0 0 340 168" role="img" aria-label="График стадий сна за ночь">`;

  let m = 0, b = [];
  NIGHT.forEach((cyc,i)=>{ cyc.forEach(([,d])=>m+=d); b.push(m); });
  [0,...b].forEach((bm,i)=>{ s += `<line x1="${x(bm)}" x2="${x(bm)}" y1="${Y0-8}" y2="${Y0+4*step+6}" stroke="var(--line)"/>`; });
  [0,90,180,270,360,450].forEach(t=>{ s += `<text x="${x(t)}" y="${Y0+4*step+24}" font-size="11" fill="var(--muted)" text-anchor="${t===450?'end':t===0?'start':'middle'}">${t?dec(t/60).replace(',0',''):'0'}${t===450?' ч':''}</text>`; });
  m = 0; let path = '', prev = null;
  nightFlat().forEach(([k,d])=>{
    const x1 = x(m), x2 = x(m+d), yy = y(k);
    path += prev===null ? `M${x1} ${yy}` : `L${x1} ${yy}`;
    path += `L${x2} ${yy}`;
    prev = k; m += d;
  });

  return s + '</svg>';
}

/* ---------- streaks ---------- */
function streak(){
  const D = new Set(S.entries.map(e=>e.date));
  let cur = 0, i = D.has(TODAY) ? 0 : D.has(daysAgo(1)) ? 1 : -1;
  if (i >= 0) while (D.has(daysAgo(i))){ cur++; i++; }
  let best = 0, run = 0, prev = null;
  [...D].sort().forEach(d=>{ const t = new Date(d+'T12:00:00'); run = prev && Math.round((t-prev)/864e5)===1 ? run+1 : 1; best = Math.max(best, run); prev = t; });
  return {cur, best:Math.max(best,cur), today:D.has(TODAY), D};
}

  const D = buf.duration, X = Math.min(3, D/5), srcs = []; let next = AC.currentTime + .05, alive = true, first = true;
  const sched = () => {
    if (!alive) return;
    while (next < AC.currentTime + 15){
      const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = buf; s.connect(g); g.connect(out);
      if (first){ g.gain.setValueAtTime(1, next); first = false; } else { g.gain.setValueAtTime(0, next); g.gain.linearRampToValueAtTime(1, next+X); }
      g.gain.setValueAtTime(1, next+D-X); g.gain.linearRampToValueAtTime(0, next+D);
      s.start(next); s.stop(next+D+.05); s.onended = () => { try{ g.disconnect(); }catch(e){} const i = srcs.indexOf(s); if (i>=0) srcs.splice(i,1); };
      srcs.push(s); next += D - X;
    }
  };
  sched(); const iv = setInterval(sched, 3000);
  nodes.push({ stop(){ alive = false; clearInterval(iv); srcs.forEach(s=>{ try{ s.stop(); }catch(e){} }); }, disconnect(){} });
}
function loadBuf(name){
  if (bufCache[name]) return Promise.resolve(bufCache[name]);
  if (!bufP[name]) bufP[name] = fetch(name+'.mp3').then(r=>{ if (!r.ok) throw new Error('http '+r.status); return r.arrayBuffer(); })
    .then(b=>new Promise((res,rej)=>AC.decodeAudioData(b,res,rej))).then(b=>(bufCache[name]=b)).catch(e=>{ delete bufP[name]; throw e; });
  return bufP[name];
}
function buildSynth(name, bus, nodes){
  if (name==='purr'){
    const am = gain(.5), br = gain(.75);
    chain(loopSrc(noiseBuf('brown',8), nodes), filt('bandpass',115,1.2), filt('lowpass',380), am, br, gain(2.4), bus);
    lfo(24, .48, am.gain, nodes); lfo(.3, .25, br.gain, nodes);
  } else {
    chain(loopSrc(noiseBuf('pink',8), nodes), filt('lowpass',2600), gain(.55), bus);
  }
}
const mixMode = () => !!S.mix;
function soundVol(name){ return (S.mixVol && S.mixVol[name] != null) ? S.mixVol[name] : 1; }
async function startOne(name){
  const tok = ++startTok, bus = AC.createGain(), nodes = [];
  bus.gain.value = 0; bus.connect(master);
  pending.set(name, tok); updateSoundUI();
  try {
    if (SOUNDS[name].file){ const buf = await loadBuf(name); if (pending.get(name)!==tok) throw 'cancel'; xfLoop(buf, bus, nodes); }
    else buildSynth(name, bus, nodes);
  } catch(e){
    if (pending.get(name)===tok){ pending.delete(name); updateSoundUI(); if (e!=='cancel') toast('Не удалось загрузить звук. Проверьте интернет и попробуйте ещё раз.'); }
    nodes.forEach(n=>{ try{ n.stop(); }catch(x){} }); try{ bus.disconnect(); }catch(x){} return;
  }
  if (pending.get(name)!==tok){ nodes.forEach(n=>{ try{ n.stop(); }catch(x){} try{ n.disconnect(); }catch(x){} }); try{ bus.disconnect(); }catch(x){} return; }
  pending.delete(name);
  active.set(name, {bus, nodes});

}
function stopOne(name, fade){
  pending.delete(name);
  const a = active.get(name); active.delete(name);
  if (a && AC){ const f = fade || .8, t = AC.currentTime; a.bus.gain.cancelScheduledValues(t); a.bus.gain.setValueAtTime(a.bus.gain.value, t); a.bus.gain.linearRampToValueAtTime(0, t+f);
    setTimeout(()=>{ a.nodes.forEach(n=>{ try{ n.stop(); }catch(e){} try{ n.disconnect(); }catch(e){} }); try{ a.bus.disconnect(); }catch(e){} }, f*1000+150); }
  if (!active.size && !pending.size){ clearInterval(sInt); sInt = null; sEnd = 0; }
}
function stopSound(fade){ [...active.keys(), ...pending.keys()].forEach(n=>stopOne(n, fade)); updateSoundUI(); }
const playingNames = () => [...active.keys(), ...[...pending.keys()].filter(k=>!active.has(k))];
async function playSound(name){
  if (!audio()){ toast('Звук не поддерживается в этом браузере'); return; }
  const on = active.has(name) || pending.has(name);
  if (mixMode()){
    if (on){ stopOne(name); return updateSoundUI(); }
    if (playingNames().length >= 3){ toast('Можно смешать до трёх звуков'); return; }
    return startOne(name);
  }
  if (on && playingNames().length === 1) return stopSound();
  playingNames().forEach(n=>stopOne(n,.6));
  return startOne(name);
}
function tickSound(){
  if (!active.size && !pending.size){ clearInterval(sInt); sInt = null; return; }
  if (sEnd && Date.now() >= sEnd){ stopSound(25); toast('Звук плавно выключен. Спокойной ночи!'); return; }

}
function mmss(ms){ const s = Math.max(0, Math.ceil(ms/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function soundStatus(){

}

function bindPet(){

  const pos = e => { const r = pet.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  pet.addEventListener('pointerdown', e => { down = true; [lx,ly] = pos(e); dist = 0; try{ pet.setPointerCapture(e.pointerId); }catch(x){} purrOn(); face('happy'); const hint = document.getElementById('pet-hint'); if (hint) hint.textContent = 'Мур-р-р…'; heart(lx,ly); });
  pet.addEventListener('pointermove', e => { if (!down) return; const [x,y] = pos(e); dist += Math.hypot(x-lx, y-ly); lx = x; ly = y; if (dist > 46){ dist = 0; strokes++; heart(x,y); if (strokes % 6 === 0 && Date.now()-said > 2500){ said = Date.now(); speak(pet, pick(PET_LINES), 1800); } } });
  const up = () => { if (!down) return; down = false; purrOff(); setTimeout(()=>{ if (!down) face('calm'); }, 900); const hint = document.getElementById('pet-hint'); if (hint) hint.textContent = 'Погладьте ещё'; };

}

function reviewFallback(){
  const L = sorted(), cur = stats(7, L.slice(-7)), prev = stats(7, L.slice(-14,-7)), ins = insights(7);

  const good = [], bad = [], plan = [];
  if (prev && cur.score > prev.score) good.push(`Индекс сна вырос с ${prev.score} до ${cur.score}.`);
  if (cur.lat <= 20) good.push('Вы засыпаете быстро — это отлично.');
  ins.filter(i=>i.d>0).forEach(i=>good.push(`${i.f} помогает: с ним сон лучше.`));
  if (cur.spread > 30) { bad.push(`Отбой гуляет на ±${cur.spread} минут.`); plan.push('Ложитесь в окне 30 минут вокруг одного времени.'); }
  if (cur.lat > 25) { bad.push(`Засыпание занимает ${Math.round(cur.lat)} минут.`); plan.push('За 30 минут до сна — без экранов, дыхание 4-7-8 в кровати.'); }
  ins.filter(i=>i.d<0).slice(0,2).forEach(i=>{ bad.push(`${i.f} портит сон.`); plan.push(FIX[i.f] || `Попробуйте неделю без фактора «${i.f}».`); });
  if (cur.sleep/60 < norm()[0]) plan.push('Сдвиньте отбой на 15–30 минут раньше.');
  if (!good.length) good.push('Вы ведёте дневник — это уже большой шаг.');
  if (!plan.length) plan.push('Держите режим и продолжайте записи.');
  const b = a => a.map(x=>'• '+x).join('\n');
  return `Что получилось\n${b(good)}\n\nЧто мешает\n${bad.length?b(bad):'• Явных помех не видно.'}\n\nПлан на неделю\n${b(plan.slice(0,3))}`;
}

function reportText(){
  const L = lastN(14), st = stats(14, L), ins = insights(14), p = S.profile || {}, [lo,hi] = norm();
  if (!st) return 'Пока нет записей в дневнике.';
  const r = [];

  if (p.age) r.push(`Возраст: ${p.age}. Норма сна по возрасту: ${lo}–${hi} ч.`);
  r.push('');
  r.push(`Средняя длительность сна: ${fmtDur(st.sleep)}`);
  r.push(`Среднее время засыпания: ${Math.round(st.lat)} мин`);
  r.push(`Средний отбой: ${fmtTime(Math.round(st.bed))} (разброс ±${st.spread} мин)`);
  r.push(`Ночей с пробуждениями 2+ раза: ${L.filter(e=>parseInt(e.wakes)>=2).length} из ${st.n}`);
  r.push(`Ночей с засыпанием дольше 30 мин: ${L.filter(e=>LAT[e.lat]>30).length} из ${st.n}`);
  r.push(`Средняя самооценка сна: ${dec(st.q)} из 5`);
  if (p.snore && p.snore!=='Нет или не знаю') r.push(`Храп (со слов): ${p.snore}`);
  if (ins.length){ r.push(''); r.push('Связи с привычками:'); ins.forEach(i=>r.push(`— ${i.f}: самооценка ${i.d<0?'ниже':'выше'} на ${dec(Math.abs(i.d))} балла`)); }
  r.push(''); r.push('По ночам:');
  L.forEach(e=>r.push(`${dayShort(e.date)}: ${e.bed}–${e.wake}, засыпание ${LAT_LABEL[e.lat]}, пробуждений ${e.wakes}, оценка ${e.q}/5${e.f.length?', '+e.f.join(', ').toLowerCase():''}`));
  r.push(''); r.push(`Составлено приложением «${APP}» по записям пользователя. Не является медицинским заключением.`);
  return r.join('\n');
}

function chatContext(){
  const st = stats(7), ins = insights(14), p = S.profile || {}, [lo,hi] = norm();
  const lines = [];
  if (p.age) lines.push('Возраст: '+p.age);
  if (p.work) lines.push('Днём: '+p.work);
  if (p.move) lines.push('Спорт: '+p.move);
  if (p.coffee) lines.push('Кофе: '+p.coffee);
  if (p.snore) lines.push('Храп: '+p.snore);
  const goals = [...(p.goal||[]), p.goalOwn].filter(Boolean); if (goals.length) lines.push('Цели: '+goals.join('; '));
  lines.push(`Норма сна для возраста: ${lo}–${hi} ч. Планирует ложиться в ${S.bedAt||'—'}, вставать в ${S.wake||'—'}.`);
  if (st) lines.push(`Дневник, последние ${st.n} ночей: в среднем сон ${fmtDur(st.sleep)}, засыпание ${Math.round(st.lat)} мин, разброс отбоя ±${st.spread} мин, средняя оценка ${dec(st.q)} из 5, индекс ${st.score}/100.`);
  if (ins.length) lines.push('Связи из дневника: '+ins.map(i=>`${i.f}: качество ${i.d<0?'ниже':'выше'} на ${dec(Math.abs(i.d))}`).join('; '));
  if (S.assess && S.assess.a && S.assess.a.pain) lines.push('Главная жалоба: '+S.assess.a.pain);

async function aiChat(){
  const sample = window.claude && window.claude.use ? await window.claude.use('sample') : null;
  const idx = S.chat.length; S.chat.push({r:'bot', t:'…'}); renderChat();
  const setText = t => { const els = document.querySelectorAll('#log .msg'); const el = els[idx]; if (el) el.textContent = t; };
  if (!sample){ S.chat[idx].t = 'Мур! Я пока учусь отвечать на любые вопросы — скоро смогу. А сейчас выберите готовый вопрос ниже, на них я отвечу сразу.'; S.opts = QUICK; save(); return renderChat(); }
  const RULES = `Ты — ${APP}, милый котёнок-ассистент по сну в приложении для Телеграма. Отвечай по-русски, на «вы», тепло и коротко: 2–5 предложений или до 4 пунктов, каждый с «• ». Можно одну лёгкую кошачью шутку.
Опирайся только на общепризнанные рекомендации по сну (AASM, National Sleep Foundation, КПТ-И). Используй данные пользователя ниже, если они относятся к вопросу. Не придумывай цифры и исследования.
Не ставь диагнозов. Не советуй лекарства, снотворное, мелатонин и добавки — в таких вопросах направляй к врачу. Если вопрос не про сон, мягко верни разговор ко сну.
Если человек пишет о мыслях причинить себе вред или о кризисе — коротко и с теплом посоветуй сразу обратиться к близким и в экстренные службы (112).

Данные пользователя:
${chatContext()}`;
  const turns = S.chat.slice(0, idx).slice(-10).map(m=>({role: m.r==='me'?'user':'assistant', content: m.t}));
  while (turns.length && turns[0].role !== 'user') turns.shift();
  const input = [{role:'user', content:RULES}, ...turns];
  if (input[input.length-1].role !== 'user') input.push({role:'user', content:'Продолжай.'});
  chatCtl = new AbortController();
  try {
    const r = await sample(input, {cache:false, signal:chatCtl.signal, onText:({text})=>setText(text)});
    S.chat[idx].t = r.text;
  } catch(e){
    S.chat[idx].t = e.code==='not_granted'||e.code==='sampling_disabled' ? 'Без разрешения на ИИ я отвечаю только на готовые вопросы ниже.'
      : e.code==='rate_limited' ? 'Я немного устал от вопросов. Попробуйте чуть позже — или выберите готовый вопрос ниже.'
      : e.code==='cancelled' ? (e.text || 'Остановлено.') : (e.text || 'Не получилось ответить. Попробуйте ещё раз.');
  }
  S.opts = (S.assess.step>=0 && S.assess.step<QS.length) ? QS[S.assess.step].o : QUICK;
  save(); renderChat();
}

function chartSVG(L){
  if (!L.length) return '';
  const [lo,hi] = norm(), many = L.length > 10;
  const x0=30, x1=312, yTop=14, yBot=124, max=11;
  const y = h => yBot - Math.min(h,max)/max*(yBot-yTop);
  const n = many ? L.length : 7, slot = (x1-x0)/n, bw = slot*(many?.62:.46);
  let s = `<svg viewBox="0 0 320 152" role="img" aria-label="Часы сна по ночам">`;
  s += `<rect x="${x0}" y="${y(hi)}" width="${x1-x0}" height="${y(lo)-y(hi)}" fill="var(--calm-soft)"/>`;
  [lo,hi].forEach(h=>{ s += `<line x1="${x0}" x2="${x1}" y1="${y(h)}" y2="${y(h)}" stroke="var(--calm)" stroke-opacity=".35" stroke-dasharray="3 4"/><text x="${x0-6}" y="${y(h)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${h}ч</text>`; });
  s += `<line x1="${x0}" x2="${x1}" y1="${yBot}" y2="${yBot}" stroke="var(--line)"/>`;
  const off = n - L.length;
  L.forEach((e,i)=>{
    const h = sleepMin(e)/60, cx = x0 + slot*(i+off) + slot/2, ok = h>=lo && h<=hi;
    s += `<rect class="bar" style="animation-delay:${i*(many?12:40)}ms" x="${(cx-bw/2).toFixed(1)}" y="${y(h).toFixed(1)}" width="${bw.toFixed(1)}" height="${(yBot-y(h)).toFixed(1)}" rx="${many?2:5}" fill="${ok?'var(--calm)':'var(--warn)'}" fill-opacity="${i===L.length-1?1:.75}"/>`;
    if (!many) s += `<text x="${cx}" y="${y(h)-6}" text-anchor="middle" font-size="11" fill="var(--fg)" style="font-variant-numeric:tabular-nums">${dec(h)}</text>`;
    if (!many) s += `<text x="${cx}" y="142" text-anchor="middle" font-size="11" fill="var(--muted)">${shortDay(e.date)}</text>`;
    else if (i%5===0 || i===L.length-1) s += `<text x="${cx}" y="142" text-anchor="middle" font-size="10" fill="var(--muted)">${new Date(e.date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'numeric'})}</text>`;
  });
  return s + '</svg>';
}

function countUp(el){
  if (!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const to = +el.dataset.to, t0 = performance.now(), dur = 700;
  const step = t => { const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = Math.round(to*e); if (k<1) requestAnimationFrame(step); };
  el.textContent = '0'; requestAnimationFrame(step);
}

const PATTERNS = {

  'box':[['Вдох',4,1],['Пауза',4,1],['Выдох',4,.55],['Пауза',4,.55]],

};
let bToken = 0;
let bTimer = null;
function breath(kind){
  const P = PATTERNS[kind], rounds = kind==='pmr' ? 1 : 4, tok = ++bToken; clearInterval(bTimer);
  $('#layer').innerHTML = `<div class="breath" role="dialog" aria-label="Дыхательное упражнение">
    <button class="close" type="button" data-stopbreath aria-label="Закрыть"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

    <div class="orb" id="orb"><b id="b-count"></b></div>
    <div class="phase" id="b-phase">Приготовьтесь</div>
    <div style="margin-top:4px">${nap('moon',150,'',false)}</div>
  </div>`;
  const orb = $('#orb'); let r=0, p=0, left=0;
  function phase(){
    if (tok !== bToken || !document.getElementById('b-phase')){ clearInterval(bTimer); return; }
    if (p>=P.length){ p=0; r++; }
    if (r>=rounds){ $('#b-phase').textContent='Готово. Теперь можно спать'; $('#b-count').textContent=''; orb.style.setProperty('--d','2s'); orb.style.setProperty('--s','.55'); clearInterval(bTimer); return; }
    $('#b-round').textContent = rounds>1 ? 'Круг '+(r+1)+' из '+rounds : 'Шаг '+(p+1)+' из '+P.length;
    const [name,sec,scale] = P[p];
    $('#b-phase').textContent = name; left = sec; $('#b-count').textContent = left;
    orb.style.setProperty('--d', sec+'s'); orb.style.setProperty('--s', scale);
  }
  orb.style.setProperty('--s','.55');
  setTimeout(()=>{ if (tok !== bToken) return; phase(); bTimer = setInterval(()=>{ if (tok !== bToken || !document.getElementById('b-count')) return clearInterval(bTimer); left--; if (left<=0){ p++; phase(); } else $('#b-count').textContent=left; },1000); }, 900);
}

${p.notes.map(n=>'- '+n[1]).join('\n') || '- (нет)'}

  if ('savediary' in t.dataset){

    if (!draft.lat || !draft.wakes || !draft.q){ toast('Отметьте засыпание, пробуждения и как спалось'); return; }
    const before = streak();
    const entry = {date:TODAY, bed:draft.bed, wake:draft.wake, lat:draft.lat, wakes:draft.wakes, q:draft.q, f:draft.f.slice()};
    S.entries = S.entries.filter(x=>x.date!==TODAY).concat(entry); draft.touched=false; save(); updateLogo(); refreshBadge();
    renderDiary();
    const after = streak();
    if (!before.today) celebrate(after.cur, after.cur > before.best); else toast('Запись обновлена');
    return;
  }
  if (t.dataset.opt) return onOpt(t.dataset.opt);
  if ('onbnext' in t.dataset){ onbStore(); O.i++; return renderOnb(); }
  if ('onbskip' in t.dataset){ if (ONB[O.i].k==='hw'){ O.a.h=0; O.a.w=0; } if (ONB[O.i].k==='name') O.a.name=''; O.i++; return renderOnb(); }
  if ('onbback' in t.dataset){ onbStore(); O.i=Math.max(0,O.i-1); return renderOnb(); }
  if ('onbfinish' in t.dataset) return finishOnb();
  if ('onbown' in t.dataset){
    const st = ONB[O.i]; O.own[st.k] = !O.own[st.k];
    if (st.type==='multi'){ if (!O.own[st.k]) O.a.goalOwn=''; } else O.a[st.k] = '';
    renderOnb(); const ta = $('#onb-own'); if (ta) ta.focus(); return;
  }
  if (t.dataset.onbpick){
    const st = ONB[O.i], v = t.dataset.onbpick;
    if (st.type==='multi'){ O.a.goal = O.a.goal.includes(v) ? O.a.goal.filter(x=>x!==v) : O.a.goal.concat(v); return renderOnb(); }
    O.own[st.k] = false; O.a[st.k] = v; renderOnb(); setTimeout(()=>{ if (ONB[O.i]===st){ O.i++; renderOnb(); } }, 220); return;
  }
  if ('onb' in t.dataset) return openOnb();
});
document.addEventListener('input', e=>{
  if (e.target.dataset && e.target.dataset.mixvol){ const k = e.target.dataset.mixvol; S.mixVol = S.mixVol || {}; S.mixVol[k] = +e.target.value; save(); const a = active.get(k); if (a && AC) a.bus.gain.setTargetAtTime(S.mixVol[k], AC.currentTime, .05); return; }
  if (e.target.id==='s-vol'){ S.vol = +e.target.value; save(); if (AC){ const t = AC.currentTime; master.gain.cancelScheduledValues(t); master.gain.setTargetAtTime(S.vol, t, .05); } return; }
  if (!e.target.closest || !e.target.closest('#onb')) return;
  onbStore(); const b = document.querySelector('#onb [data-onbnext]'); if (b) b.disabled = !onbValid(ONB[O.i]);
});
document.addEventListener('change', e=>{
  if (e.target.id==='set-tz'){ const i = +e.target.value; S.tzIdx = i; S.tz = CITIES[i][0]; return settingsChanged(); }
  if (!e.target.value) return;
  if (e.target.id==='plan-wake'){ const keep = S.bedAt ? (toMin(S.wake)-toMin(S.bedAt)+1440)%1440 : 7.5*60+15; S.wake = e.target.value; S.bedAt = fmtTime(toMin(S.wake)-keep); }
  else if (e.target.id==='plan-bed') S.bedAt = e.target.value;
  else return;
  save(); renderSleep();
});
function syncTimes(){ const b=$('#f-bed'), w=$('#f-wake'); if (b&&b.value) draft.bed=b.value; if (w&&w.value) draft.wake=w.value; }
document.addEventListener('submit', e=>{
  if (e.target.id!=='composer') return; e.preventDefault();
  const i = $('#chat-in'), v = i.value.trim(); if (!v) return;
  if (typing || aiBusyChat) return;
  i.value = ''; me(v); S.opts=null; save();
  aiBusyChat = true; aiChat().finally(()=>{ aiBusyChat = false; });
});

document.querySelectorAll('#sky .stars').forEach(box=>{ const n = box.classList.contains('many') ? 34 : 9, maxY = box.classList.contains('many') ? 250 : 110; for (let i=0;i<n;i++){ const st = document.createElement('i'); st.style.left = (Math.random()*100)+'%'; st.style.top = (Math.random()*maxY)+'px'; st.style.animationDelay = (Math.random()*4)+'s'; st.style.animationDuration = (3+Math.random()*4)+'s'; if (Math.random()<.2){ st.style.width = st.style.height = '3px'; } box.appendChild(st); } });
let lastPhase = null, lastDay = TODAY;
function applyPhase(){ const ph = curPhase(); document.documentElement.dataset.phase = ph; if (tg){ try { tg.setHeaderColor && tg.setHeaderColor('#0E131D'); } catch(e){} } return ph; }
lastPhase = applyPhase();
setInterval(()=>{ const today = iso(tzNow()); if (today !== TODAY){ TODAY = today; } const ph = applyPhase(); if (ph !== lastPhase || today !== lastDay){ lastPhase = ph; lastDay = today; if (!document.querySelector('#layer .scrim, #layer .breath') && current==='sleep') renderSleep(); } }, 30000);
refreshBadge(); go('sleep');
if (!S.onboarded) openOnb();
/* restore from Telegram cloud when this device has no local data yet (new phone, reinstall) */
(function(){ let hasLocal = false; try { hasLocal = !!localStorage.getItem(KEY); } catch(e){}
  if (!hasLocal || !S.entries.length) cloudLoad(data=>{ if (!data || !data.entries || !data.entries.length) return;
    S = Object.assign(freshState(), data); if (BETA) S.premium = true; TZ = S.tz || ''; TODAY = iso(tzNow());
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
    const onb = document.getElementById('onb'); if (onb && S.onboarded) onb.remove();
    refreshBadge(); go(current); toast('Данные восстановлены из облака Телеграма'); });
})();
/* Telegram back button closes overlays; light haptics on taps */
if (tg && tg.BackButton && tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')){
  const syncBack = () => { const open = document.querySelector('#layer > *') || document.getElementById('onb'); try { open ? tg.BackButton.show() : tg.BackButton.hide(); } catch(e){} };
  new MutationObserver(syncBack).observe(document.body, {childList:true, subtree:false});
  new MutationObserver(syncBack).observe(document.getElementById('layer'), {childList:true});
  tg.BackButton.onClick(()=>{
    const L = document.getElementById('layer');
    const btn = L.querySelector('[data-closesheet],[data-closewd],[data-closecalm],[data-stopbreath]');
    if (btn) return btn.click();
    if (L.firstElementChild){ L.innerHTML = ''; return syncBack(); }
    const onb = document.getElementById('onb'); if (onb){ const back = onb.querySelector('[data-onbback]'); if (back && O.i > 0) back.click(); }
  });
  syncBack();
}
if (tg && tg.HapticFeedback){ document.addEventListener('click', e=>{ const b = e.target.closest('button'); if (!b) return; try {
  if (b.matches('.mascot,[data-savediary],[data-buy],[data-worry],[data-goodnight]')) tg.HapticFeedback.impactOccurred('medium'); else tg.HapticFeedback.selectionChanged(); } catch(x){} }, true); }
document.addEventListener('click', e=>{ const a = e.target.closest('a[data-privacy]'); if (a && tg && tg.openLink){ e.preventDefault(); try { tg.openLink(new URL('privacy.html', location.href).href); } catch(x){ location.href = 'privacy.html'; } } });
})();
</script>
