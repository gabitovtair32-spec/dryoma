<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0E131D">
<meta name="color-scheme" content="dark">
<title>Дрёма</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>window.DRYOMA_API = 'https://dryoma-bot.tairgabitov7981.workers.dev';</script>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
html,body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
</style>

<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&family=Prata&display=swap">
<style>
/* Layout: one phone-width column; label-above-value everywhere; Prata only for headings, all numbers in Commissioner. */
:root{
  --bg:#0E131D; --surface:#151B27; --raise:#1D2433; --line:#262F42; --line-strong:#344058;
  --fg:#ECE8DD; --muted:#8D94A7; --moon:#E3CC94; --moon-soft:rgba(227,204,148,.12); --moon-line:rgba(227,204,148,.45);
  --calm:#8FB8A8; --calm-soft:rgba(143,184,168,.14); --warn:#D69A86; --warn-soft:rgba(214,154,134,.14);
  --f-display:"Prata",Georgia,"Times New Roman",serif;
  --f-body:"Commissioner",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-card:20px; --r-ctl:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--moon);outline-offset:2px}
p{margin:0}

/* shell */
.app{max-width:440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px calc(104px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:40px;margin-bottom:24px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:22px;line-height:1}
.logo-mascot{width:34px;height:34px;display:grid;place-items:center;flex:none}
.logo-mascot svg{width:34px;height:34px}
.plus-badge{height:28px;display:inline-flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.04em;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}
.plus-badge.on{border-color:transparent;background:var(--moon-soft);color:var(--moon)}

/* type */
h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:32px 0 12px;line-height:1.3}
.sub{color:var(--muted);margin-top:6px}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:1.45}
.num,.big,.dur,.value{font-variant-numeric:tabular-nums}
.big{font-family:var(--f-body);font-weight:500;font-size:40px;line-height:1.05;letter-spacing:-.02em}
.lbl,.field>label{font-size:13px;color:var(--muted);line-height:1.3}

/* primitives */
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px}
.divide{border-top:1px solid var(--line);margin-top:20px;padding-top:20px}
.badge{display:inline-flex;align-items:center;height:22px;font-size:12px;font-weight:500;padding:0 9px;border-radius:999px;flex:none;white-space:nowrap}
.badge.ok{background:var(--calm-soft);color:var(--calm)}
.badge.low{background:var(--warn-soft);color:var(--warn)}
.primary{width:100%;height:52px;border-radius:16px;background:var(--moon);color:#1A1810;font-weight:600;font-size:16px}
.primary:active{transform:scale(.99)}
.primary:disabled{opacity:.35;cursor:default}
.ghost{height:40px;padding:0 16px;border-radius:12px;background:var(--raise);font-size:14px;font-weight:500}
.link{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.links{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:32px}
.chev{color:var(--muted);flex:none}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.dot.good{background:var(--calm)}.dot.bad{background:var(--warn)}.dot.mid{background:var(--moon)}

/* list rows inside a card */
.rows>*{padding:14px 0;border-top:1px solid var(--line)}
.rows>*:first-child{border-top:0;padding-top:0}
.rows>*:last-child{padding-bottom:0}

/* schedule */
.tpair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbox{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:var(--r-ctl);background:var(--raise);border:1px solid var(--line);cursor:pointer;min-width:0}
.tlab{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);line-height:1.3}
.tlab svg{color:var(--moon);flex:none}
.tbox input[type=time]{height:auto;border-radius:0;background:none;border:0;padding:0;margin:0;font-family:var(--f-body);font-weight:500;font-size:clamp(20px,6.4vw,26px);line-height:1.2;letter-spacing:-.01em;color:var(--fg);width:100%;min-width:0;font-variant-numeric:tabular-nums}
.tbox input[type=time]::-webkit-calendar-picker-indicator{opacity:.4;filter:invert(1)}
.result{margin-top:20px}
.result .lbl{margin-bottom:4px}
.dur{font-weight:500;font-size:36px;line-height:1.1;letter-spacing:-.02em;color:var(--moon)}
.result .small{margin-top:8px}
.vars-title{font-size:15px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;width:100%;padding:12px 16px;border-radius:var(--r-ctl);background:var(--raise);border:1px solid transparent;text-align:left}
.opt[aria-pressed=true]{border-color:var(--moon-line);background:var(--moon-soft)}
.opt-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt-title{display:flex;align-items:center;gap:8px;font-weight:500}
.opt-sub{font-size:13px;color:var(--muted)}
.opt-time{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.opt-time .lbl{font-size:12px}
.opt-time b{font-weight:500;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.opt[aria-pressed=true] .opt-time b{color:var(--moon)}
.foot-note{margin-top:12px}

/* norm */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:999px;background:var(--raise);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--moon-soft);border-color:var(--moon-line);color:var(--moon)}
.norm{margin-top:20px}
.norm .lbl{margin-bottom:4px}
.norm .row{align-items:baseline;gap:10px}
.norm .big{color:var(--calm)}
.norm .small{margin-top:8px}
.why{display:flex;flex-direction:column;gap:14px}
.why>div{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}
.why .k{width:28px;height:28px;border-radius:9px;background:var(--raise);display:grid;place-items:center;color:var(--moon)}
.why p{font-size:14px;padding-top:3px}
.why p b{font-weight:500}

/* list buttons */
.item{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.item:hover{border-color:var(--line-strong)}
.item .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--raise);color:var(--moon)}
.item .t{min-width:0;display:flex;flex-direction:column;gap:1px}
.item .t b{font-weight:500}
.item .t span{font-size:13px;color:var(--muted)}
.prompt{background:var(--moon-soft);border-color:rgba(227,204,148,.28);margin-top:20px}
.prompt .ic{background:rgba(227,204,148,.16)}

/* diary */
.form{display:flex;flex-direction:column;gap:20px;margin-top:20px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.times{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;text-align:left;line-height:48px}
input[type=time]::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=time]::-webkit-calendar-picker-indicator{opacity:.45;filter:invert(1)}
.tpair{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important}
.tbox input[type=time]{line-height:1.2!important}
input[type=time],input[type=text],input[type=number],textarea{width:100%;background:var(--raise);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:0 14px;height:48px;font:inherit;font-size:17px;font-variant-numeric:tabular-nums}
textarea{height:auto;padding:12px 14px;font-size:16px;resize:vertical}
.moons{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.moonbtn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px 10px;border-radius:var(--r-ctl);background:var(--raise);border:1px solid var(--line);color:var(--muted);font-size:11px;line-height:1.2}
.moonbtn[aria-pressed=true]{color:var(--moon);border-color:var(--moon-line);background:var(--moon-soft)}
.entry{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start}
.entry .moonic{color:var(--moon);padding-top:1px}
.entry .t{min-width:0}
.entry-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.entry-top b{font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;line-height:22px;padding:0 8px;border-radius:999px;background:var(--raise);color:var(--muted)}
.tag.ex{border:1px dashed var(--line-strong);background:none;line-height:20px}

/* stats */
.score{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.score .big{font-size:52px;color:var(--moon)}
.score-word{margin-top:6px;font-weight:500}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.metric{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.metric .lbl{font-size:12px}
.metric b{font-weight:500;font-size:18px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.chart svg{width:100%;height:auto;display:block}
.chart .small{margin-top:10px}
.insight{display:grid;grid-template-columns:8px 1fr;gap:12px}
.insight b{font-weight:500}
.locked{position:relative;overflow:hidden}
.locked .blur{filter:blur(6px);opacity:.45;pointer-events:none;user-select:none}
.locked .over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;background:linear-gradient(180deg,rgba(21,27,39,.2),rgba(21,27,39,.88))}
.locked .over .ghost{margin-top:4px}

/* chat */
.lockview{text-align:center;padding:32px 20px 20px}
.lockview .halo{width:72px;height:72px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:var(--moon-soft);color:var(--moon)}
.lockview h1{font-size:24px}
.lockview .sub{margin-top:8px}
.feats{display:flex;flex-direction:column;gap:12px;margin:24px 0}
.feat{display:grid;grid-template-columns:16px 1fr;gap:10px;text-align:left;align-items:start}
.feat svg{color:var(--calm);margin-top:3px}
.note{font-size:12px;color:var(--muted);text-align:center;margin-bottom:16px}
.log{display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-line;overflow-wrap:anywhere;line-height:1.5}
.msg.bot{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--moon-soft);border-bottom-right-radius:6px;align-self:flex-end}
.typing{align-self:flex-start;color:var(--muted);font-size:13px;padding:4px 6px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.composer{display:grid;grid-template-columns:1fr 48px;gap:8px;margin-top:16px}
.composer button{height:48px;border-radius:12px;background:var(--moon);color:#1A1810;display:grid;place-items:center}

/* onboarding */
.onb{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto}
.onb .in{max-width:440px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.onb .bar{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:12px;height:40px}
.onb .back{width:36px;height:36px;border-radius:50%;background:var(--raise);display:grid;place-items:center}
.onb .prog{height:4px;border-radius:4px;background:var(--raise);overflow:hidden}
.onb .prog i{display:block;height:100%;background:var(--moon);border-radius:4px;transition:width .3s}
.onb .step{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.onb .body{flex:1;display:flex;flex-direction:column;gap:16px;padding-top:20px}
.onb h1{font-size:26px}
.onb .hint{font-size:14px;color:var(--muted);margin-top:-8px}
.onb .choices{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.onb .choice{width:100%;text-align:left;padding:14px 16px;min-height:52px;border-radius:var(--r-ctl);background:var(--surface);border:1px solid var(--line);font-size:16px;line-height:1.35}
.onb .choice[aria-pressed=true]{border-color:var(--moon-line);background:var(--moon-soft);color:var(--moon)}
.onb .choice.own{border-style:dashed;color:var(--muted)}
.onb .choice.own[aria-pressed=true]{color:var(--moon);border-style:solid}
.onb .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.onb .unit{position:relative}
.onb .unit input{padding-right:44px}
.onb .unit span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.onb input[type=text]{margin-top:8px}
.onb input.timein{margin-top:8px;height:64px!important;font-size:30px!important;font-weight:500;text-align:left}
.onb .foot{display:flex;flex-direction:column;gap:4px;padding-top:24px}
.onb .skip{height:44px;color:var(--muted);font-size:14px}
.onb .body>h2{margin:16px 0 0}
.hero-moon{width:88px;height:88px;margin:0 auto 12px;color:var(--moon)}
.res-norm{display:flex;align-items:baseline;gap:10px;margin-top:4px}
.res-norm .big{font-size:44px;color:var(--calm)}
.plan-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plan-row>div{display:flex;flex-direction:column;gap:2px}
.plan-row>div:nth-child(2){align-items:center}
.plan-row>div:last-child{align-items:flex-end}
.plan-row b{font-weight:500;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.note-row{display:grid;grid-template-columns:8px 1fr;gap:12px;font-size:14px}
.ai-card{background:linear-gradient(180deg,var(--moon-soft),transparent 75%),var(--surface)}
.ai-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--moon);margin-bottom:12px}
.ai-text{white-space:pre-line;font-size:14px;line-height:1.6}

/* mascot */
:root{--fur:#EAD5A2;--fur-shade:#CDB176;--fur-line:#A98C55;--ear:#EDB4A0;--ink:#231C12;--nose:#C98B7A;--blush:#E9A68E;--st-wake:#D69A86;--st-rem:#E3CC94;--st-n1:#3B4762;--st-n2:#62728E;--st-n3:#8FB8A8}
.drema{display:block;overflow:visible}
.drema .bob{transform-origin:32px 56px;animation:bob 4.5s ease-in-out infinite}
.drema .zz{animation:zz 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.drema .zz.z2{animation-delay:1.2s}
.drema .breathe{transform-origin:56px 56px;animation:bob 3.6s ease-in-out infinite}
.mascot{display:block;padding:0;line-height:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.mascot:focus-visible{outline:2px solid var(--moon);outline-offset:2px;border-radius:12px}
.nap{position:absolute;z-index:2}
.nap svg{display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.nap-r{right:16px}
.has-nap{position:relative}
.plus-wrap{position:relative;display:inline-block}
.plus-wrap .badge-cat{position:absolute;right:6px;bottom:calc(100% - 9px)}
.drema .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
.drema .ear{transform-box:fill-box;transform-origin:50% 100%;animation:twitch 8s infinite}
.drema .ear-r{animation-duration:9.5s}
.drema .head.flat .ear-l{animation:none;transform:rotate(-26deg)}
.drema .head.flat .ear-r{animation:none;transform:rotate(26deg)}
.drema .tail{transform-box:fill-box;transform-origin:0% 50%;animation:swish 3.2s ease-in-out infinite}
.drema .vein{animation:pulse .6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes twitch{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-9deg)}94%{transform:rotate(4deg)}}
@keyframes swish{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.hop{animation:hop .45s ease-out}
.shake{animation:shake .4s ease-in-out 2}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-7px) scale(1.04)}70%{transform:translateY(1px)}100%{transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px) rotate(-3deg)}40%{transform:translateX(4px) rotate(3deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.speech{position:fixed;left:0;top:0;z-index:70;will-change:transform;max-width:min(260px,calc(100vw - 16px));background:var(--fg);color:#141821;font-size:14px;line-height:1.4;font-weight:500;padding:10px 13px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);pointer-events:none;opacity:0;visibility:hidden;transition:opacity .16s,visibility 0s .16s}
.speech.show{opacity:1;visibility:visible;transition:opacity .16s}
.speech::after{content:"";position:absolute;left:calc(var(--ax,50%) - 7px);top:100%;border:7px solid transparent;border-top-color:var(--fg)}
.speech.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--fg)}
@keyframes bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.985)}}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}40%{opacity:1}100%{opacity:0;transform:translate(3px,-6px)}}
.say{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:end;margin-top:20px}
.say .av{width:56px;height:56px}
.hero-drema .mascot{margin:0 auto}
.say .bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 14px}
.say .who{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--moon);margin-bottom:2px}
.say p{font-size:14px;line-height:1.5}
.card .say{margin-top:0}
.hero-drema{width:120px;height:120px;margin:0 auto 12px}
/* learn */
.hypno svg{width:100%;height:auto;display:block;font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.stage{display:grid;grid-template-columns:10px 1fr auto;gap:4px 12px;align-items:baseline}
.stage i{width:10px;height:10px;border-radius:3px;align-self:center}
.stage b{font-weight:500}
.stage .share{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage p{grid-column:2 / 4;font-size:14px;color:var(--muted)}

.drema .wave{transform-box:fill-box;transform-origin:50% 100%;animation:wave .9s ease-in-out infinite alternate}
.drema .rollx{animation:rollx 2.8s ease-in-out infinite alternate}
.drema .spin{transform-box:fill-box;transform-origin:center;animation:spin 2.8s ease-in-out infinite alternate}
.drema .grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 2.4s ease-in-out infinite}
.drema .tapA{animation:tap .32s ease-in-out infinite alternate}
.drema .tapB{animation:tap .32s ease-in-out .16s infinite alternate}
.drema .run{animation:run 4.2s linear infinite}
.drema .bobfast{animation:bobfast .3s ease-in-out infinite alternate}
.drema .legA,.drema .legB{transform-box:fill-box;transform-origin:50% 0}
.drema .legA{animation:leg .3s ease-in-out infinite alternate}
.drema .legB{animation:leg .3s ease-in-out -.3s infinite alternate-reverse}
.drema .dust{animation:dust .6s ease-out infinite}
.drema .dust.d2{animation-delay:.3s}
.drema .ring{transform-box:fill-box;transform-origin:50% 50%;animation:ringshake .12s linear infinite alternate}
.drema .ringl{animation:blinkl .5s steps(2) infinite}
.drema .steam{animation:steam 2.2s ease-in-out infinite}
.drema .steam.s2{animation-delay:1.1s}
.drema .snore{transform-box:fill-box;transform-origin:100% 50%;animation:snore 3s ease-in-out infinite}
.drema .bounce{animation:bounce 1s cubic-bezier(.3,0,.6,1) infinite alternate}

@keyframes wave{from{transform:rotate(-14deg)}to{transform:rotate(22deg)}}
@keyframes rollx{from{transform:translateX(0)}to{transform:translateX(110px)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(540deg)}}
@keyframes grow{0%,100%{transform:scaleY(1)}50%{transform:scale(.97,1.16)}}
@keyframes tap{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes run{from{transform:translate(-40px,76px)}to{transform:translate(340px,76px)}}
@keyframes bobfast{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes leg{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
@keyframes dust{from{opacity:.5;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(-10px,-4px) scale(1.8)}}
@keyframes ringshake{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes blinkl{0%{opacity:1}100%{opacity:0}}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-10px)}}
@keyframes snore{0%,100%{transform:scale(.4)}60%{transform:scale(1.6)}}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-42px)}}
@keyframes shadow{from{transform:scale(1);opacity:.35}to{transform:scale(.45);opacity:.15}}
@media (prefers-reduced-motion:reduce){.drema .wave,.drema .rollx,.drema .spin,.drema .grow,.drema .tapA,.drema .tapB,.drema .bobfast,.drema .legA,.drema .legB,.drema .dust,.drema .ring,.drema .ringl,.drema .steam,.drema .snore,.drema .bounce,.drema .shadow{animation:none}.drema .run{animation:none;transform:translate(150px,76px)}}
@media (prefers-reduced-motion:reduce){.drema .bob,.drema .zz,.drema .breathe,.drema .eyes,.drema .ear,.drema .tail,.drema .vein,.hop,.shake{animation:none}}

input[type=range]{width:100%;accent-color:var(--moon);height:28px;background:none;border:0;padding:0}

.sky{position:fixed;left:0;right:0;top:0;height:300px;pointer-events:none;z-index:0;overflow:hidden;-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}

@keyframes twinkle{0%,100%{opacity:.12}50%{opacity:.75}}

@keyframes rise{from{transform:translateY(10px)}to{transform:translateY(-12px)}}

@keyframes spinr{to{transform:rotate(360deg)}}

.gear{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--raise)}

main section:not([hidden]){animation:fadeUp .3s ease-out}

.sounds{grid-template-columns:1fr 1fr}

.wd-in{max-width:440px;margin:0 auto;padding:calc(56px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}

.say + .worry-cta,.say + .calm-cta{margin-top:20px}
.calm{position:fixed;inset:0;z-index:50;overflow-y:auto;background:radial-gradient(120% 55% at 50% 0%,#1A2A33 0%,#0D1219 65%)}
.calm-in{max-width:440px;margin:0 auto;padding:calc(56px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.calm-in h1{text-align:center}
.calm-in>.sub{text-align:center}
.pet{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;margin:16px auto 8px;width:220px;padding:10px 0;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.pet:active{cursor:grabbing}
.pet::before{content:"";position:absolute;inset:18px 30px 34px;border-radius:50%;background:radial-gradient(circle,rgba(238,143,166,.12),transparent 70%);pointer-events:none}
.pet-hint{font-size:13px;color:var(--muted)}
.heart{position:absolute;pointer-events:none;transform:translate(-50%,-50%);animation:heart 1.3s ease-out forwards}
@keyframes heart{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-260%) scale(.8)}}
.card.kind{text-align:center;padding:24px 20px;margin-top:12px}
.kind-text{font-family:var(--f-display);font-size:21px;line-height:1.4;margin:12px 0 18px;text-wrap:balance;min-height:3em}
.kind-text.fadein{animation:fadeUp .5s ease-out}
.worry{display:flex;flex-direction:column;gap:12px}
.worry textarea{transition:transform .9s cubic-bezier(.5,0,.75,0),opacity .9s}
.worry textarea.fly{transform:translate(40px,-260px) scale(.15) rotate(-25deg);opacity:0}
.ground .g-step{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center}
.g-n{font-size:40px;font-weight:600;color:var(--calm);text-align:center}
.g-step p{font-size:15px}
.g-dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.g-dots i{width:7px;height:7px;border-radius:50%;background:var(--raise)}
.g-dots i.on{background:var(--calm)}
.ground .ghost,.good .ghost{width:100%;margin-top:4px}
.ground>.small{margin-bottom:12px}
.g-done{display:flex;gap:10px;align-items:center;color:var(--calm);margin-bottom:12px;font-weight:500}
.good{display:flex;flex-direction:column;gap:10px}
.good-list{display:flex;flex-direction:column;gap:8px}
.good-list div{display:grid;grid-template-columns:16px 1fr;gap:10px;align-items:start}
.good-list svg{color:var(--calm);margin-top:3px}
.calm-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}
.calm-btns .ghost{height:44px}
.calm-safe{text-align:center;margin-top:20px}
.worry-list .wl p{font-size:15px}
.wl-btns{display:flex;gap:8px;margin-top:10px}
.wl-btns .ghost{flex:1;height:36px;font-size:13px}
/* mixer, review, wardrobe */
.mixseg{margin:0 0 10px}
.mixvols{display:flex;flex-direction:column;gap:4px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mixvols .vol{margin-top:0}
.review{background:var(--raise);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:16px;min-height:120px}
.wardrobe{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wr{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:var(--raise);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.wr.on{border-color:var(--moon-line);background:var(--moon-soft);color:var(--moon)}
.wr-av{width:52px;height:52px}
.wr-lock{position:absolute;top:8px;right:8px;color:var(--muted)}
/* report */
.rep-cta{background:linear-gradient(135deg,rgba(227,204,148,.14),rgba(143,184,168,.08)),var(--surface);border-color:rgba(227,204,148,.3)}
.rep-cta .ic{background:rgba(227,204,148,.16)!important;overflow:hidden}
.rep-cta .ic svg{margin-top:4px}
.rep{position:fixed;inset:0;z-index:50;overflow-y:auto;background:radial-gradient(120% 50% at 50% 0%,#1D2540 0%,#0D1219 60%)}
.rep-in{max-width:480px;margin:0 auto;padding:calc(56px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.rep-wait{display:flex;flex-direction:column;gap:12px;align-items:stretch;padding-top:calc(90px + env(safe-area-inset-top,0px))}
.think{position:relative;display:flex;justify-content:center}
.think .dots{position:absolute;right:calc(50% - 86px);top:6px;display:flex;gap:4px}
.think .dots i{width:7px;height:7px;border-radius:50%;background:var(--moon);animation:dot 1.2s ease-in-out infinite}
.think .dots i:nth-child(2){animation-delay:.2s}.think .dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.shimmer{height:64px;border-radius:16px;background:linear-gradient(90deg,var(--surface) 0%,var(--raise) 50%,var(--surface) 100%);background-size:200% 100%;animation:shim 1.4s linear infinite;margin-top:6px}
.shimmer.s2{height:120px}.shimmer.s3{height:90px}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.rep-top{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:center;margin-top:16px}
.ring{width:110px;height:110px}
.ring-arc{animation:ring 1s ease-out both}
@keyframes ring{from{stroke-dasharray:0 400}}
.rep-verdict{font-size:17px;font-weight:600;line-height:1.35;display:block}
.rep-top .delta{display:inline-block;margin-top:8px;text-align:left;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.kpis>div{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-width:0}
.kpis b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpis span:last-child{font-size:12px}
.kpis .ok{color:var(--calm)}.kpis .bad{color:var(--warn)}
.finding{display:grid;grid-template-columns:8px minmax(0,1fr);gap:12px}
.finding b{font-weight:600}
.finding p{margin-top:4px}
.srcchip{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:6px;background:var(--raise);color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.04em;vertical-align:middle;white-space:nowrap}
.srcs>div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.hbar{transform-box:fill-box;animation:growx .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}}
.meter{margin-top:14px}
.meter-bar{position:relative;height:12px;border-radius:8px;background:linear-gradient(90deg,var(--warn-soft) 0 70%,var(--calm-soft) 70% 100%)}
.meter-bar i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--calm);border-radius:2px}
.meter-bar b{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--moon);box-shadow:0 0 0 4px rgba(227,204,148,.2)}
.meter-lbl{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted)}
.jl{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.jl>div{display:flex;flex-direction:column;gap:2px}
.jl b{font-size:22px;font-weight:600}
.jl-arrow{color:var(--muted);font-size:20px}
.jl-d{grid-column:1 / -1;flex-direction:row!important;align-items:baseline;gap:8px!important;padding-top:10px;border-top:1px solid var(--line)}
.jl-d.bad b{color:var(--warn)}.jl-d.ok b{color:var(--calm)}
.jl-d span{font-size:13px;color:var(--muted)}
.plan{display:flex;flex-direction:column;gap:8px}
.pstep{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start}
.pnum{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--moon);color:#1A1810;font-weight:700}
.pstep b{font-weight:600}
.pstep p{margin-top:4px;font-size:14px}
.goal{margin-top:8px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(135deg,rgba(143,184,168,.14),transparent),var(--surface);border-color:rgba(143,184,168,.3)}
.goal b{font-size:16px;font-weight:600}
.doc{margin-top:8px;border-color:rgba(214,154,134,.35);background:var(--warn-soft)}
.doc b{font-weight:600}
.doc p{margin-top:4px}
.rep-btns{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.rep-btns .ghost{height:48px}
.trial-note{text-align:center;margin-top:12px}
.plus-line{display:flex;align-items:center;gap:10px}
@media (prefers-reduced-motion:reduce){.think .dots i,.shimmer,.ring-arc,.hbar{animation:none}}
/* room & quests */

.qhead{display:flex;align-items:center;gap:12px;min-width:0}
.qhead .lbl{margin:0}
.qring{--p:0;flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--calm) calc(var(--p)*1%),var(--raise) 0);position:relative;transition:--p .6s}
.qring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.qring b{position:relative;font-size:12px;font-weight:700}
.qring.sm{width:38px;height:38px}
.qring.sm b{font-size:11px}
.quests.all .qring{background:conic-gradient(var(--moon) 100%,var(--raise) 0)}
.qitem{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-radius:12px;background:var(--raise);font-size:14px;transition:background .2s,transform .12s}
.qitem:active{transform:scale(.985)}
.qitem .qbox{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-strong);display:grid;place-items:center;color:#1A1810;transition:background .25s,border-color .25s}
.qitem.ok .qbox{background:var(--calm);border-color:var(--calm)}
.qitem .qt{position:relative}
.qitem.ok .qt{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(141,148,167,.5)}
.qitem .qr{font-size:12px;font-weight:600;color:var(--moon);white-space:nowrap}
.qitem.ok .qr{color:var(--calm);font-weight:500}
.qitem.just{animation:qflash 1.2s ease-out}
.qitem.just .qbox{animation:qpop .5s cubic-bezier(.3,1.6,.5,1)}
.qitem.just .qbox svg{stroke-dasharray:30;stroke-dashoffset:30;animation:qdraw .45s .15s ease-out forwards}
@keyframes qpop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes qdraw{to{stroke-dashoffset:0}}
@keyframes qflash{0%{background:rgba(143,184,168,.35)}100%{background:var(--raise)}}
.qstrip{margin-top:12px}
.qstrip .qring{margin-right:2px}
.fishchip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;background:rgba(143,184,168,.14);color:var(--calm);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fishchip b{font-weight:700}
.fishchip.big{height:32px;font-size:15px}
.fishchip.glass{background:rgba(14,19,29,.55);color:#DDEFE7;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.fishchip.bump{animation:bump .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.flyfish{position:fixed;left:0;top:0;z-index:80;font-size:20px;line-height:1;pointer-events:none;will-change:transform}
.flyfish.big{font-size:26px}
.room-card{padding:10px}
.room{position:relative;width:100%;aspect-ratio:340/250;border-radius:14px;overflow:hidden;background:#1C2440;isolation:isolate}
.room-bg{position:absolute;inset:0;width:100%;height:100%}
.room .ri{position:absolute;display:block;padding:0;line-height:0}
.room .ri svg{width:100%;height:auto;display:block}
.room .books{left:60%;top:22%;width:25%}
.room .rug{left:16%;bottom:1%;width:66%}
.room .lamp{left:2%;bottom:9%;width:11%;cursor:pointer}
.room .plant{right:1%;bottom:6%;width:14%}
.room .plant .leaf-sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg)}}
.room .aqua{right:16%;bottom:12%;width:19%}
.room .proj{left:15%;bottom:8%;width:10%}
.room .pillow{left:26%;bottom:7%;width:48%}
.room .yarn{right:28%;bottom:3%;width:8%;cursor:pointer}
.room .yarn.roll{animation:yroll 1.1s ease-out}
@keyframes yroll{0%{transform:none}40%{transform:translateX(-36px) rotate(-300deg)}70%{transform:translateX(-30px) rotate(-260deg)}100%{transform:none}}
.room .pop{animation:popin .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popin{0%{transform:translateY(-30px) scale(.3);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.room-cat-wrap{position:absolute;bottom:8%;width:27%;transform:translateX(-50%);transition:left 1.8s cubic-bezier(.45,.05,.4,1);z-index:3}

.room-cat-wrap.sleeping{width:44%;bottom:9%}
.room-cat-wrap .room-cat{position:relative;width:100%}
.room-cat-wrap .room-cat svg{width:100%!important;height:auto!important;display:block}
.room-cat-wrap.flip .room-cat svg{transform:scaleX(-1)}
.room-cat-wrap.walking .room-cat svg{animation:walkbob .32s ease-in-out infinite alternate}
.room-cat-wrap.flip.walking .room-cat svg{animation-name:walkbobf}
@keyframes walkbob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-4px) rotate(2deg)}}
@keyframes walkbobf{from{transform:scaleX(-1) translateY(0) rotate(-2deg)}to{transform:scaleX(-1) translateY(-4px) rotate(2deg)}}
.room-cat-wrap .room-cat .drema g:first-child{}
.room .room-cat.sit svg > g:not(.tail){}
.cat-shadow{position:absolute;left:18%;right:12%;bottom:-2px;height:7px;border-radius:50%;background:rgba(0,0,0,.28);z-index:-1;filter:blur(1px)}
.room .room-cat.sit .drema{transform-origin:50% 100%}
.room .room-cat.sit .drema > ellipse,.room .room-cat.sit .drema{}
.room .garland{position:absolute;left:44%;right:3%;top:3%;display:flex;justify-content:space-between;align-items:flex-start}

.room .curtain{transform-box:fill-box;transform-origin:50% 0;animation:curt 6s ease-in-out infinite}
.room .curtain.cr{animation-delay:-3s}
@keyframes curt{0%,100%{transform:skewX(0)}50%{transform:skewX(2.5deg)}}
.room .fishy{animation:swim 4s ease-in-out infinite alternate}
.room .fishy.f2{animation-duration:5.2s;animation-direction:alternate-reverse}
@keyframes swim{from{transform:translateX(-6px)}to{transform:translateX(8px)}}
.room .bubble-up{animation:bub 3s ease-in infinite}
.room .bubble-up.b2{animation-delay:-1.4s}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-18px);opacity:0}}
.motes,.flies{position:absolute;inset:0;pointer-events:none;z-index:1}
.motes i{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,246,214,.7);animation:mote 9s ease-in-out infinite}
@keyframes mote{0%,100%{transform:translate(0,0);opacity:0}30%{opacity:.8}50%{transform:translate(14px,-22px)}80%{opacity:.5}}
.flies i{position:absolute;width:4px;height:4px;border-radius:50%;background:#FFF0A8;box-shadow:0 0 8px 2px rgba(255,236,150,.6);animation:fly 8s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(0,0);opacity:.2}25%{transform:translate(18px,-10px);opacity:1}50%{transform:translate(-6px,-24px);opacity:.4}75%{transform:translate(-20px,-6px);opacity:1}}
.room-top{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;align-items:center;z-index:4;pointer-events:none}
.lvl-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 4px;border-radius:999px;background:rgba(14,19,29,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:12px;font-weight:600;color:#ECE8DD}

.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 4px 2px}
.meter{display:flex;align-items:center;gap:8px;min-width:0}
.m-ic{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--raise);font-size:15px}
.m-b{flex:1;min-width:0;font-size:12px;color:var(--muted)}

.lvl-card .lvl{display:flex;gap:12px;align-items:center}
.lvl{display:flex;gap:12px;align-items:center}

/* ---- tolerant JSON parse + sanitize ---- */
function parseJSONLoose(t){
  if (!t) return null;
  t = String(t).replace(/<think>[\s\S]*?<\/think>/g,'').trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) t = fence[1];
  const a = t.indexOf('{'), b = t.lastIndexOf('}'); if (a < 0 || b <= a) return null;
  try { return JSON.parse(t.slice(a, b+1)); } catch(e){ return null; }
}
function cleanReport(r){
  if (!r || typeof r !== 'object') return null;
  const S = (v, n) => String(v == null ? '' : v).replace(/\s+/g,' ').trim().slice(0, n);
  const okSrc = k => KB_SOURCES[S(k,10).toUpperCase()] ? S(k,10).toUpperCase() : '';
  const lv = v => ['good','warn','bad'].includes(v) ? v : 'warn';
  const out = {
    verdict: S(r.verdict, 120), summary: S(r.summary, 600),
    findings: (Array.isArray(r.findings) ? r.findings : []).slice(0,4).map(f=>({title:S(f.title,80), text:S(f.text,320), metric:S(f.metric,20), level:lv(f.level), source:okSrc(f.source)})).filter(f=>f.title && f.text),
    plan: (Array.isArray(r.plan) ? r.plan : []).slice(0,4).map(p=>({title:S(p.title,80), how:S(p.how,260), why:S(p.why,260), source:okSrc(p.source)})).filter(p=>p.title && p.how),
    goal: S(r.goal, 200), doctor: S(r.doctor, 300)
  };
  return out.verdict && out.findings.length >= 2 && out.plan.length >= 2 ? out : null;
}

/* ---- rule-based report (fallback, same shape) ---- */
function ruleReport(m){
  const F = [], P = [];
  const sleepOK = m.sleepH >= m.lo;
  F.push(sleepOK
    ? {title:'Сна хватает', text:`В среднем вы спите ${m.sleepH} ч — это в пределах нормы ${m.lo}–${m.hi} ч.`, metric:'duration', level:'good', source:'NSF'}
    : {title:'Сна меньше нормы', text:`В среднем выходит ${m.sleepH} ч при норме ${m.lo}–${m.hi} ч; ниже нормы — ${m.below} из ${m.n} ночей.`, metric:'duration', level:'bad', source:'NSF'});
  if (m.eff < 85) F.push({title:'Много времени без сна', text:`Эффективность сна ${m.eff}% — ниже ориентира 85%: заметная часть ночи проходит в постели без сна.`, metric:'efficiency', level:'warn', source:'CBTI'});
  else F.push({title:'Сон плотный', text:`Эффективность сна ${m.eff}% — выше ориентира 85%.`, metric:'efficiency', level:'good', source:'CBTI'});
  if (m.spread > 30) F.push({title:'Режим скачет', text:`Время отбоя гуляет на ±${m.spread} мин — организму сложно понять, когда пора спать.`, metric:'regularity', level:'warn', source:'REG'});
  if (m.lat > 30) F.push({title:'Долгое засыпание', text:`Засыпание занимает в среднем ${m.lat} мин — дольше обычных 20–30 минут.`, metric:'latency', level:'warn', source:'CBTI'});
  if (m.jetlag != null && m.jetlag > 60) F.push({title:'Выходные сбивают ритм', text:`Середина сна в выходные смещается на ${m.jetlag} мин — это социальный джетлаг.`, metric:'jetlag', level:'warn', source:'SJL'});
  const bad = (m.factors||[]).filter(f=>f.d <= -0.5).sort((a,b)=>a.d-b.d)[0];
  if (bad) F.push({title:`${bad.f} мешает`, text:`В ночи с фактором «${bad.f}» самооценка ниже на ${Math.abs(bad.d)} балла.`, metric:'factor', level:'bad', source: /кофе/i.test(bad.f)?'CAF':/алког/i.test(bad.f)?'ALC':/телефон/i.test(bad.f)?'LIGHT':'CBTI'});
  if (m.spread > 30 || (m.jetlag != null && m.jetlag > 60)) P.push({title:'Один подъём на всю неделю', how:`Вставайте в ${m.wake} каждый день, в выходные — не позже чем на час.`, why:`Разброс отбоя сейчас ±${m.spread} мин.`, source:'REG'});
  if (m.eff < 85 || m.lat > 30) P.push({title:'Правило 20 минут', how:'Не уснули примерно за 20 минут — встаньте, почитайте при тусклом свете и вернитесь, когда потянет в сон.', why:`Эффективность сна ${m.eff}%, засыпание ${m.lat} мин.`, source:'CBTI'});
  if (!sleepOK) P.push({title:'Отбой на 20 минут раньше', how:'Сдвигайте отбой на 15–20 минут каждые 2–3 дня, пока не выйдете на норму.', why:`Сейчас в среднем ${m.sleepH} ч при норме от ${m.lo} ч.`, source:'AASM'});
  if (bad) P.push({title:`Неделя без «${bad.f.toLowerCase()}»`, how:'Попробуйте 7 дней без этого фактора и отмечайте ночи в дневнике.', why:`С ним самооценка ниже на ${Math.abs(bad.d)} балла.`, source: /кофе/i.test(bad.f)?'CAF':/алког/i.test(bad.f)?'ALC':'LIGHT'});
  P.push({title:'Утренний свет', how:'10–30 минут дневного света в первый час после подъёма.', why:'Помогает вечером засыпать вовремя.', source:'LIGHT'});
  P.push({title:'Час тишины перед сном', how:'За час до сна — приглушённый свет, телефон на зарядку вне кровати.', why:'Экраны задерживают мелатонин.', source:'LIGHT'});
  const score = m.score;
  return {
    verdict: score >= 80 ? 'Сон в хорошей форме — держим режим' : score >= 60 ? 'Неплохо, но есть что подтянуть' : 'Сну нужна помощь — начнём с режима',
    summary: `За ${m.n} ${m.n%10===1&&m.n%100!==11?'ночь':'ночей'} индекс сна ${score} из 100. Средний сон ${m.sleepH} ч, засыпание ${m.lat} мин, эффективность ${m.eff}%.`,
    findings: F.slice(0,4), plan: P.slice(0,3),
    goal: !sleepOK ? `Спать не меньше ${m.lo} ч хотя бы 5 ночей из 7` : m.spread > 30 ? 'Ложиться в окне 30 минут 5 ночей из 7' : 'Заполнить дневник 7 ночей подряд',
    doctor: (m.latLong >= 3 && m.n >= 7) || m.wakesMany >= 4 ? 'Если трудности со сном повторяются 3 и более ночей в неделю дольше трёх месяцев — стоит обсудить это с терапевтом или сомнологом.' : ''
  };
}

/* ---------- sleep metrics for the report ---------- */
const rnd1 = x => Math.round(x*10)/10;
function sleepMetrics(n){
  const L = lastN(n || 14); if (L.length < 3) return null;
  const [lo,hi] = norm(), sum = a => a.reduce((x,y)=>x+y,0);
  const asleep = L.map(sleepMin), bedIn = L.map(inBed), beds = L.map(bedNorm), wakes = L.map(e=>toMin(e.wake));
  const meanBed = avg(beds), sd = Math.sqrt(avg(beds.map(b=>(b-meanBed)**2)));
  const mid = e => bedNorm(e) + inBed(e)/2, wd = e => new Date(e.date+'T12:00:00').getDay();
  const we = L.filter(e=>[0,6].includes(wd(e))), wk = L.filter(e=>![0,6].includes(wd(e)));
  const factors = FACTORS.map(f=>{ const w = L.filter(e=>e.f.includes(f)), wo = L.filter(e=>!e.f.includes(f));
    return w.length && wo.length ? {f, d: rnd1(avg(w.map(e=>e.q)) - avg(wo.map(e=>e.q))), n: w.length} : null; }).filter(Boolean);
  const cur = stats(7, L.slice(-7)), prev = L.length >= 10 ? stats(7, L.slice(-14,-7)) : null;
  return {
    n: L.length, lo, hi, from: L[0].date, to: L[L.length-1].date,
    sleepH: rnd1(avg(asleep)/60), below: asleep.filter(m=>m/60 < lo).length,
    eff: Math.round(sum(asleep)/Math.max(1,sum(bedIn))*100),
    lat: Math.round(avg(L.map(e=>LAT[e.lat]))), latLong: L.filter(e=>LAT[e.lat] > 30).length,
    wakes: rnd1(avg(L.map(e=>parseInt(e.wakes)))), wakesMany: L.filter(e=>parseInt(e.wakes) >= 2).length,
    bed: fmtTime(Math.round(meanBed)), spread: Math.round(sd), wake: fmtTime(Math.round(avg(wakes))),
    jetlag: we.length && wk.length ? Math.round(Math.abs(avg(we.map(mid)) - avg(wk.map(mid)))) : null,
    midWk: wk.length ? fmtTime(Math.round(avg(wk.map(mid)))) : null, midWe: we.length ? fmtTime(Math.round(avg(we.map(mid)))) : null,
    q: rnd1(avg(L.map(e=>e.q))), score: Math.round(avg(L.map(scoreOf))),
    trend: cur && prev ? cur.score - prev.score : null,
    factors: factors.sort((a,b)=>Math.abs(b.d)-Math.abs(a.d))
  };
}
function profileLines(){
  const p = S.profile || {}, out = [];
  if (p.age) out.push('Возраст: '+p.age); if (p.work) out.push('Днём: '+p.work); if (p.move) out.push('Спорт: '+p.move);
  if (p.coffee) out.push('Кофе: '+p.coffee); if (p.snore) out.push('Храп: '+p.snore);
  const g = [...(p.goal||[]), p.goalOwn].filter(Boolean); if (g.length) out.push('Цели: '+g.join('; '));
  return out;
}

/* ---------- charts ---------- */
function ringSVG(score){
  const r = 44, c = 2*Math.PI*r, k = Math.max(0, Math.min(100, score))/100, col = score>=80?'var(--calm)':score>=60?'var(--moon)':'var(--warn)';
  return `<svg class="ring" viewBox="0 0 110 110" role="img" aria-label="Индекс сна ${score} из 100"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--raise)" stroke-width="10"/>
    <circle class="ring-arc" cx="55" cy="55" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c*k).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 55 55)"/>
    <text x="55" y="57" text-anchor="middle" font-size="30" font-weight="600" fill="var(--fg)" style="font-variant-numeric:tabular-nums">${score}</text><text x="55" y="76" text-anchor="middle" font-size="11" fill="var(--muted)">из 100</text></svg>`;
}
function bedtimeSVG(L, m){
  const beds = L.map(bedNorm), lo = Math.floor((Math.min(...beds)-30)/60)*60, hi = Math.ceil((Math.max(...beds)+30)/60)*60;
  const X0 = 40, X1 = 312, Y0 = 14, Y1 = 118, y = v => Y0 + (v-lo)/(hi-lo)*(Y1-Y0), x = i => X0 + (L.length===1 ? (X1-X0)/2 : i/(L.length-1)*(X1-X0));
  const mean = avg(beds);
  let s = `<svg viewBox="0 0 320 140" role="img" aria-label="Время отбоя по ночам">`;
  s += `<rect x="${X0}" y="${y(mean-30).toFixed(1)}" width="${X1-X0}" height="${(y(mean+30)-y(mean-30)).toFixed(1)}" rx="4" fill="var(--calm-soft)"/>`;
  for (let t = lo; t <= hi; t += 60) s += `<line x1="${X0}" x2="${X1}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${X0-6}" y="${(y(t)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtTime(t)}</text>`;
  s += `<polyline points="${beds.map((b,i)=>`${x(i).toFixed(1)},${y(b).toFixed(1)}`).join(' ')}" fill="none" stroke="var(--st-n2)" stroke-width="1.4"/>`;
  beds.forEach((b,i)=>{ const off = Math.abs(b-mean) > 30; s += `<circle cx="${x(i).toFixed(1)}" cy="${y(b).toFixed(1)}" r="4" fill="${off?'var(--warn)':'var(--calm)'}"/>`; });
  s += `<text x="${X0}" y="134" font-size="10" fill="var(--muted)">${dayShort(L[0].date)}</text><text x="${X1}" y="134" text-anchor="end" font-size="10" fill="var(--muted)">${dayShort(L[L.length-1].date)}</text>`;
  return s + '</svg>';
}
function factorSVG(F){
  if (!F.length) return '<p class="small muted">Отмечайте в дневнике, что было вчера, — и здесь появится, что помогает, а что мешает.</p>';
  const rows = F.slice(0,6), H = rows.length*30+10, C = 214, W = 92, max = Math.max(1, ...rows.map(f=>Math.abs(f.d)));
  let s = `<svg viewBox="0 0 320 ${H}" role="img" aria-label="Влияние привычек на сон">`;

  rows.forEach((f,i)=>{ const yy = 8 + i*30, w = Math.abs(f.d)/max*W, pos = f.d >= 0;
    s += `<text x="0" y="${yy+14}" font-size="12" fill="var(--fg)">${esc(f.f.length>22?f.f.slice(0,21)+'…':f.f)}</text>`;

    s += `<text x="${pos?C+w+5:C-w-5}" y="${yy+15}" font-size="11" text-anchor="${pos?'start':'end'}" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${f.d>0?'+':''}${dec(f.d)}</text>`; });
  return s + '</svg>';
}

  if (h > 0.02){ p.full = Math.max(0, p.full - h*4); p.joy = Math.max(0, p.joy - h*3); p.t = Date.now(); }
  return p;
}
function petMood(){
  const p = petNow();
  if (p.full < 25) return {face:'calm', line:'Мур… я бы перекусил рыбкой.'};
  if (p.joy < 25) return {face:'calm', line:'Поиграете со мной? Немножко?'};
  if (p.full > 70 && p.joy > 70) return {face:'bright', line:'Мне так хорошо! Мур-р-р.'};
  return {face:'bright', line:''};
}
function todayQuests(){
  if (!S.q || S.q.d !== TODAY){
    const pool = ['breath','winddown','pet','kind','fact','learn','feed','ask'].concat(S.premium ? ['sound'] : []);
    const h = hash(TODAY), a = pool[h % pool.length], rest = pool.filter(x=>x!==a), b = rest[(h>>>8) % rest.length];
    S.q = {d:TODAY, list:['diary', a, b], done:[], bonus:false};
    if (S.entries.some(e=>e.date===TODAY)) S.q.done.push('diary');
    save();
  }
  return S.q;
}

/* ---- анимации: рыбки летят к счётчику, сердечки, числа ---- */
function fishTarget(){
  const vis = [...document.querySelectorAll('[data-fishtotal]')].filter(el=>{ const r = el.getBoundingClientRect(); return r.width && r.bottom > 0 && r.top < innerHeight; });
  return vis[0] || null;
}
function countTo(el, to){
  if (!el) return;
  const from = parseInt(el.dataset.v || el.textContent.replace(/\D/g,''), 10) || 0; el.dataset.v = to;
  if (reduceMotion() || from === to){ el.querySelector('b') ? el.querySelector('b').textContent = to : null; return; }
  const b = el.querySelector('b'); if (!b) return;
  const t0 = performance.now(), d = 600;
  const step = now => { const k = Math.min(1, (now - t0)/d); b.textContent = Math.round(from + (to-from)*(1-Math.pow(1-k,3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
}
function syncFish(){ document.querySelectorAll('[data-fishtotal]').forEach(el=>countTo(el, S.fish)); }
function flyFish(from, n, onDone){
  const to = fishTarget();
  if (!from || !to || reduceMotion() || !from.getBoundingClientRect().width){ onDone && onDone(); return; }
  const a = from.getBoundingClientRect(), b = to.getBoundingClientRect(), k = Math.min(n, 6);
  let left = k;
  for (let i = 0; i < k; i++){
    const f = document.createElement('span'); f.className = 'flyfish'; f.textContent = '🐟'; document.body.appendChild(f);
    const x0 = a.left + a.width/2 + (Math.random()-.5)*a.width*.4, y0 = a.top + a.height/2, x1 = b.left + 14, y1 = b.top + b.height/2;
    const mx = (x0 + x1)/2 + (Math.random()-.5)*80, my = Math.min(y0, y1) - 60 - Math.random()*40;
    const anim = f.animate([
      {transform:`translate(${x0}px,${y0}px) scale(.4)`, opacity:0},
      {transform:`translate(${x0}px,${y0-18}px) scale(1.15)`, opacity:1, offset:.15},
      {transform:`translate(${mx}px,${my}px) scale(1)`, opacity:1, offset:.55},
      {transform:`translate(${x1}px,${y1}px) scale(.55)`, opacity:.9}
    ], {duration:820 + i*70, delay:i*90, easing:'cubic-bezier(.45,.05,.4,1)', fill:'both'});
    anim.onfinish = () => { f.remove(); if (--left === 0) onDone && onDone(); };
  }
}
function burst(host, x, y, chars, n){
  if (!host || reduceMotion()) return;
  for (let i = 0; i < (n||5); i++){
    const h = document.createElement('span'); h.className = 'fx'; h.textContent = pick(chars);
    h.style.left = x + 'px'; h.style.top = y + 'px';
    h.style.setProperty('--dx', ((Math.random()-.5)*70).toFixed(0) + 'px');
    h.style.setProperty('--dy', (-50 - Math.random()*50).toFixed(0) + 'px');
    h.style.animationDelay = (i*70) + 'ms';
    host.appendChild(h); setTimeout(()=>h.remove(), 1500 + i*70);
  }
}
function catPoint(){
  const room = document.getElementById('room'), cat = room && room.querySelector('.room-cat');
  if (!room || !cat) return null;
  const r = room.getBoundingClientRect(), c = cat.getBoundingClientRect();
  return {room, x: c.left - r.left + c.width/2, y: c.top - r.top + c.height*.3};
}
function haptic(kind){ try { tg && tg.HapticFeedback && (kind==='ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.impactOccurred(kind||'light')); } catch(e){} }

function addFish(n, why, from){
  initRoom();
  const before = lvlOf(S.xp), got = n * fishMul();
  S.fish += got; S.xp += got; save();
  const after = lvlOf(S.xp);
  const done = () => { syncFish(); updateRoomUI(); };
  if (from && fishTarget()) flyFish(from, Math.min(got, 6), done);
  else { if (why) toast(`+${got} 🐟 ${why}`); done(); }
  if (after > before) setTimeout(()=>levelUp(after), 900);
}
function questDone(k, from){
  const q = todayQuests(); if (!q.list.includes(k) || q.done.includes(k)) return;
  q.done.push(k); S.qJust = k; save();
  addFish(QUEST[k].r, 'Задание выполнено', from || document.querySelector(`.qitem[data-quest="${k}"]`));
  if (q.done.length === q.list.length && !q.bonus){ q.bonus = true; save(); setTimeout(()=>{ addFish(5, 'Все задания дня!', document.querySelector('.quests')); confetti(); const c = document.querySelector('.room-cat') || document.querySelector('#logo-mascot .mascot'); if (c) speak(c, 'Все задания на сегодня! Вы лучше всех. Мур!', 2600); }, 1300); }
}
function levelUp(l){
  let el = document.getElementById('lvlup');
  if (!el){ el = document.createElement('div'); el.id = 'lvlup'; el.className = 'lvlup'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.innerHTML = `<span class="lu-cat">${drema('happy',44)}</span><span><b>Уровень ${l}!</b><span>${APP} теперь «${lvlName(l)}» · в магазине новые вещи</span></span>`;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  confetti(); haptic('ok'); clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 4200);
}

function stageTotals(limit){
  const t = {W:0,R:0,N1:0,N2:0,N3:0}; let m = 0;

function hypnoSVG(){
  const X0=66, X1=330, Y0=18, step=28, total=450;
  const x = m => X0 + m/total*(X1-X0), y = k => Y0 + STAGE[k].y*step;
  let s = `<svg viewBox="0 0 340 168" role="img" aria-label="График стадий сна за ночь">`;
  Object.keys(STAGE).forEach(k=>{ s += `<text x="0" y="${y(k)+4}" font-size="11" fill="var(--muted)">${STAGE[k].n}</text><line x1="${X0}" x2="${X1}" y1="${y(k)}" y2="${y(k)}" stroke="var(--line)" stroke-dasharray="2 4"/>`; });
  let m = 0, b = [];
  NIGHT.forEach((cyc,i)=>{ cyc.forEach(([,d])=>m+=d); b.push(m); });
  [0,...b].forEach((bm,i)=>{ s += `<line x1="${x(bm)}" x2="${x(bm)}" y1="${Y0-8}" y2="${Y0+4*step+6}" stroke="var(--line)"/>`; });
  [0,90,180,270,360,450].forEach(t=>{ s += `<text x="${x(t)}" y="${Y0+4*step+24}" font-size="11" fill="var(--muted)" text-anchor="${t===450?'end':t===0?'start':'middle'}">${t?dec(t/60).replace(',0',''):'0'}${t===450?' ч':''}</text>`; });
  m = 0; let path = '', prev = null;
  nightFlat().forEach(([k,d])=>{
    const x1 = x(m), x2 = x(m+d), yy = y(k);
    path += prev===null ? `M${x1} ${yy}` : `L${x1} ${yy}`;
    path += `L${x2} ${yy}`;
    prev = k; m += d;
  });
  s += `<path d="${path}" fill="none" stroke="var(--st-n2)" stroke-width="1.6" stroke-linejoin="round"/>`;
  m = 0;
  nightFlat().forEach(([k,d])=>{ if (k==='R'||k==='N3') s += `<line x1="${x(m)}" x2="${x(m+d)}" y1="${y(k)}" y2="${y(k)}" stroke="${STAGE[k].c}" stroke-width="5" stroke-linecap="round"/>`; m+=d; });
  return s + '</svg>';
}

/* ---------- streaks ---------- */
function streak(){
  const D = new Set(S.entries.map(e=>e.date));
  let cur = 0, i = D.has(TODAY) ? 0 : D.has(daysAgo(1)) ? 1 : -1;
  if (i >= 0) while (D.has(daysAgo(i))){ cur++; i++; }
  let best = 0, run = 0, prev = null;
  [...D].sort().forEach(d=>{ const t = new Date(d+'T12:00:00'); run = prev && Math.round((t-prev)/864e5)===1 ? run+1 : 1; best = Math.max(best, run); prev = t; });
  return {cur, best:Math.max(best,cur), today:D.has(TODAY), D};
}
function flame(size, lit, anim){
  const c1 = lit ? '#F0A35E' : 'var(--line-strong)', c2 = lit ? '#F7D27A' : 'var(--raise)';

}
function streakCard(){
  const st = streak(), wk = [];
  for (let i=6;i>=0;i--){ const d = daysAgo(i); wk.push(`<div class="${i===0?'today':''}">${flame(18, st.D.has(d), false)}<span>${shortDay(d)}</span></div>`); }
  const note = st.today ? 'Сегодня отмечено. Увидимся завтра утром!'
    : st.cur ? `Отметьте эту ночь — и серия вырастет до ${st.cur+1}.` : 'Отметьте эту ночь, чтобы начать новую серию.';

}

function bindPet(){
  const pet = document.getElementById('pet'); if (!pet) return;
  let down = false, lx = 0, ly = 0, dist = 0, strokes = 0, said = 0;
  const face = f => { const svg = pet.querySelector('svg'); if (svg) svg.outerHTML = drema(f,150); };
  const heart = (x,y) => { const h = document.createElement('span'); h.className = 'heart'; h.style.left = x+'px'; h.style.top = y+'px'; h.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10Z" fill="#EE8FA6"/></svg>'; pet.appendChild(h); setTimeout(()=>h.remove(), 1300); };
  const pos = e => { const r = pet.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  pet.addEventListener('pointerdown', e => { setTimeout(()=>questDone('pet'), 900); down = true; [lx,ly] = pos(e); dist = 0; try{ pet.setPointerCapture(e.pointerId); }catch(x){} purrOn(); face('happy'); const hint = document.getElementById('pet-hint'); if (hint) hint.textContent = 'Мур-р-р…'; heart(lx,ly); });
  pet.addEventListener('pointermove', e => { if (!down) return; const [x,y] = pos(e); dist += Math.hypot(x-lx, y-ly); lx = x; ly = y; if (dist > 46){ dist = 0; strokes++; heart(x,y); if (strokes % 6 === 0 && Date.now()-said > 2500){ said = Date.now(); speak(pet, pick(PET_LINES), 1800); } } });
  const up = () => { if (!down) return; down = false; purrOff(); setTimeout(()=>{ if (!down) face('calm'); }, 900); const hint = document.getElementById('pet-hint'); if (hint) hint.textContent = 'Погладьте ещё'; };
  pet.addEventListener('pointerup', up); pet.addEventListener('pointercancel', up); pet.addEventListener('lostpointercapture', up);
}

/* ---------- weekly AI review (Plus) ---------- */
function reviewFallback(){
  const L = sorted(), cur = stats(7, L.slice(-7)), prev = stats(7, L.slice(-14,-7)), ins = insights(7);
  if (!cur) return 'Пока мало записей — заполните дневник хотя бы за 3 ночи.';
  const good = [], bad = [], plan = [];
  if (prev && cur.score > prev.score) good.push(`Индекс сна вырос с ${prev.score} до ${cur.score}.`);
  if (cur.lat <= 20) good.push('Вы засыпаете быстро — это отлично.');
  ins.filter(i=>i.d>0).forEach(i=>good.push(`${i.f} помогает: с ним сон лучше.`));
  if (cur.spread > 30) { bad.push(`Отбой гуляет на ±${cur.spread} минут.`); plan.push('Ложитесь в окне 30 минут вокруг одного времени.'); }
  if (cur.lat > 25) { bad.push(`Засыпание занимает ${Math.round(cur.lat)} минут.`); plan.push('За 30 минут до сна — без экранов, дыхание 4-7-8 в кровати.'); }
  ins.filter(i=>i.d<0).slice(0,2).forEach(i=>{ bad.push(`${i.f} портит сон.`); plan.push(FIX[i.f] || `Попробуйте неделю без фактора «${i.f}».`); });
  if (cur.sleep/60 < norm()[0]) plan.push('Сдвиньте отбой на 15–30 минут раньше.');
  if (!good.length) good.push('Вы ведёте дневник — это уже большой шаг.');
  if (!plan.length) plan.push('Держите режим и продолжайте записи.');
  const b = a => a.map(x=>'• '+x).join('\n');
  return `Что получилось\n${b(good)}\n\nЧто мешает\n${bad.length?b(bad):'• Явных помех не видно.'}\n\nПлан на неделю\n${b(plan.slice(0,3))}`;
}

function reportText(){
  const L = lastN(14), st = stats(14, L), ins = insights(14), p = S.profile || {}, [lo,hi] = norm();
  if (!st) return 'Пока нет записей в дневнике.';
  const r = [];
  r.push(`Дневник сна за ${st.n} ${plural(st.n,'ночь','ночи','ночей')} (${dayShort(L[0].date)} — ${dayShort(L[L.length-1].date)})`);
  if (p.age) r.push(`Возраст: ${p.age}. Норма сна по возрасту: ${lo}–${hi} ч.`);
  r.push('');
  r.push(`Средняя длительность сна: ${fmtDur(st.sleep)}`);
  r.push(`Среднее время засыпания: ${Math.round(st.lat)} мин`);
  r.push(`Средний отбой: ${fmtTime(Math.round(st.bed))} (разброс ±${st.spread} мин)`);
  r.push(`Ночей с пробуждениями 2+ раза: ${L.filter(e=>parseInt(e.wakes)>=2).length} из ${st.n}`);
  r.push(`Ночей с засыпанием дольше 30 мин: ${L.filter(e=>LAT[e.lat]>30).length} из ${st.n}`);
  r.push(`Средняя самооценка сна: ${dec(st.q)} из 5`);
  if (p.snore && p.snore!=='Нет или не знаю') r.push(`Храп (со слов): ${p.snore}`);
  if (ins.length){ r.push(''); r.push('Связи с привычками:'); ins.forEach(i=>r.push(`— ${i.f}: самооценка ${i.d<0?'ниже':'выше'} на ${dec(Math.abs(i.d))} балла`)); }
  r.push(''); r.push('По ночам:');
  L.forEach(e=>r.push(`${dayShort(e.date)}: ${e.bed}–${e.wake}, засыпание ${LAT_LABEL[e.lat]}, пробуждений ${e.wakes}, оценка ${e.q}/5${e.f.length?', '+e.f.join(', ').toLowerCase():''}`));
  r.push(''); r.push(`Составлено приложением «${APP}» по записям пользователя. Не является медицинским заключением.`);

function chatContext(){

Данные пользователя:
${chatContext()}`;
  const turns = S.chat.slice(0, idx).slice(-10).map(m=>({role: m.r==='me'?'user':'assistant', content: m.t}));

}

function sleepTalk(hasToday, durH, lo, bed){
  const q = lastQ(), ph = curPhase();

/* ---------- tab: stats ---------- */
function chartSVG(L){
  if (!L.length) return '';
  const [lo,hi] = norm(), many = L.length > 10;
  const x0=30, x1=312, yTop=14, yBot=124, max=11;
  const y = h => yBot - Math.min(h,max)/max*(yBot-yTop);
  const n = many ? L.length : Math.max(7, L.length), slot = (x1-x0)/n, bw = slot*(many?.62:.46);
  let s = `<svg viewBox="0 0 320 152" role="img" aria-label="Часы сна по ночам">`;
  s += `<rect x="${x0}" y="${y(hi)}" width="${x1-x0}" height="${y(lo)-y(hi)}" fill="var(--calm-soft)"/>`;
  [lo,hi].forEach(h=>{ s += `<line x1="${x0}" x2="${x1}" y1="${y(h)}" y2="${y(h)}" stroke="var(--calm)" stroke-opacity=".35" stroke-dasharray="3 4"/><text x="${x0-6}" y="${y(h)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${h}ч</text>`; });
  s += `<line x1="${x0}" x2="${x1}" y1="${yBot}" y2="${yBot}" stroke="var(--line)"/>`;
  const off = n - L.length;
  L.forEach((e,i)=>{
    const h = sleepMin(e)/60, cx = x0 + slot*(i+off) + slot/2, ok = h>=lo && h<=hi;
    s += `<rect class="bar" style="animation-delay:${i*(many?12:40)}ms" x="${(cx-bw/2).toFixed(1)}" y="${y(h).toFixed(1)}" width="${bw.toFixed(1)}" height="${(yBot-y(h)).toFixed(1)}" rx="${many?2:5}" fill="${ok?'var(--calm)':'var(--warn)'}" fill-opacity="${i===L.length-1?1:.75}"/>`;
    if (!many) s += `<text x="${cx}" y="${y(h)-6}" text-anchor="middle" font-size="11" fill="var(--fg)" style="font-variant-numeric:tabular-nums">${dec(h)}</text>`;
    if (!many) s += `<text x="${cx}" y="142" text-anchor="middle" font-size="11" fill="var(--muted)">${shortDay(e.date)}</text>`;
    else if (i%5===0 || i===L.length-1) s += `<text x="${cx}" y="142" text-anchor="middle" font-size="10" fill="var(--muted)">${new Date(e.date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'numeric'})}</text>`;
  });
  return s + '</svg>';
}
function scoreWord(n){ return n>=85?'Отличный сон':n>=70?'Хороший сон':n>=50?'Есть над чем поработать':'Сон страдает'; }
function insightHTML(n){
  const st = stats(n), ins = insights(n);
  let h = ins.map(i=>`<div class="insight"><span class="dot ${i.d<0?'bad':'good'}"></span><div><b>${esc(i.f)}</b><div class="small muted">${i.d<0?'Сон хуже':'Сон лучше'} на ${dec(Math.abs(i.d))} балла по шкале из 5 (${i.n} ${plural(i.n,'ночь','ночи','ночей')} из ${st.n})</div></div></div>`).join('');
  h += `<div class="insight"><span class="dot mid"></span><div><b>Время отбоя гуляет на ±${st.spread} мин</b><div class="small muted">${st.spread>30?'Попробуйте ложиться в окне 30 минут — организм быстрее привыкнет.':'Режим ровный. Так держать.'}</div></div></div>`;
  return h;
}
function statsTalk(st){
  const h = st.sleep/60;
  if (st.spread > 30) return `Главное, что я бы исправил, — режим. Отбой гуляет на ±${st.spread} минут. Ложитесь в одно и то же время, хотя бы в окне 30 минут.`;
  if (st.lat > 25) return `Засыпаете в среднем за ${Math.round(st.lat)} минут — долговато. Попробуйте дыхание 4-7-8 и никаких экранов за полчаса до сна.`;
  if (h < 7) return `В среднем выходит ${fmtDur(st.sleep)} — меньше нормы. Я бы сдвинул отбой на 30 минут раньше.`;
  return 'Неделя хорошая: режим ровный, сна хватает. Продолжаем в том же духе!';
}
function dynHTML(){
  const L = sorted(), cur = stats(7, L.slice(-7)), prev = stats(7, L.slice(-14,-7));
  if (!cur || !prev) return '<p class="small muted">Нужно хотя бы две недели записей.</p>';
  const row = (name, a, b, fmt, better) => { const d = a-b, good = better==='up' ? d>0 : d<0, same = Math.abs(d) < (name==='Индекс сна'?1:name==='Сон'?5:1);
    return `<div class="dyn"><span>${name}</span><b class="num">${fmt(a)}</b><span class="delta ${same?'':good?'up':'down'}">${same?'без изменений':(d>0?'+':'−')+fmt(Math.abs(d),true)}</span></div>`; };
  return row('Индекс сна', cur.score, prev.score, (v)=>Math.round(v), 'up')
    + row('Сон', cur.sleep, prev.sleep, (v,dd)=>dd?Math.round(v)+' мин':fmtShort(v), 'up')
    + row('Засыпание', cur.lat, prev.lat, (v)=>Math.round(v)+' мин', 'down')
    + row('Разброс отбоя', cur.spread, prev.spread, (v,dd)=>(dd?'':'±')+Math.round(v)+' мин', 'down');
}

function countUp(el){
  if (!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const to = +el.dataset.to, t0 = performance.now(), dur = 700;
  const step = t => { const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = Math.round(to*e); if (k<1) requestAnimationFrame(step); };
  el.textContent = '0'; requestAnimationFrame(step);
}

const QS = [
  {k:'pain', q:'Что мешает больше всего?', o:['Долго засыпаю','Просыпаюсь ночью','Встаю разбитым','Сбитый режим']},

const QUICK = ['Почему я плохо сплю?','Что делать, если проснулся ночью?','Сколько мне нужно спать?','Можно выпить снотворное?','Пройти опрос заново'];
function bot(t){ S.chat.push({r:'bot',t}); }
function me(t){ S.chat.push({r:'me',t}); }
function startAssess(){
  S.assess = {step:0, a:{}};
  bot('Привет! Я ваш ассистент сна. Задам 4 коротких вопроса, а потом вместе с вашим дневником соберу личный план сна.');
  bot(QS[0].q); S.opts = QS[0].o;
}
function plan(){
  const a = S.assess.a, st = stats(), ins = insights();
  const w = toMin(a.wake), bed = fmtTime(w - 5*90 - 15);
  const tips = {
    'Долго засыпаю':['За час до сна — тусклый свет и никаких рабочих чатов.','Ложитесь, только когда клонит в сон. Не уснули за 20 минут — встаньте и вернитесь позже.','Перед сном — дыхание 4-7-8 на вкладке «Сон».'],
    'Просыпаюсь ночью':['Проснулись — не смотрите на часы, это запускает тревогу.','Алкоголь и поздний ужин чаще всего дают ночные пробуждения.','Если не засыпаете 20 минут — встаньте, почитайте бумажную книгу при тусклом свете.'],
    'Встаю разбитым':['Будильник ставьте на конец цикла — время отбоя ниже как раз под это.','Сразу после подъёма — 10 минут дневного света у окна или на улице.','Кофе не раньше чем через 60–90 минут после пробуждения.'],
    'Сбитый режим':['Главное — одинаковое время подъёма, даже в выходные.','Сдвигайте отбой постепенно, по 15 минут каждые 2–3 дня.','Днём не спите дольше 20 минут и не позже 15:00.']
  }[a.pain];
  let t = `Ваш план на 2 недели\n\nЦель: ложиться в ${bed}, чтобы встать в ${a.wake} после 5 полных циклов.`;
  t += `\n\n` + tips.map(x=>'• '+x).join('\n');
  if (a.phone !== 'Меньше 15 минут') t += `\n• Телефон — на зарядку вне кровати за 30 минут до сна. Включите будильник на отбой.`;
  if (st) t += `\n\nПо дневнику: в среднем вы спите ${fmtDur(st.sleep)}, засыпаете за ${Math.round(st.lat)} мин.`;
  const bad = ins.filter(i=>i.d<0)[0];
  if (bad) t += ` Сильнее всего сон портит «${bad.f.toLowerCase()}» — в такие ночи качество ниже на ${dec(Math.abs(bad.d))} балла.`;
  if (a.day === 'Сонливость весь день') t += `\n\nСильная дневная сонливость, которая держится неделями, — повод показаться врачу. Иногда за ней стоит не режим, а то, что стоит проверить.`;
  t += `\n\nЗаполняйте дневник каждое утро — через неделю я скажу, что сработало.`;
  return t;
}
function answerQuick(q){
  const st = stats(), ins = insights();
  if (q==='Пройти опрос заново'){ S.assess={step:0,a:{}}; bot(QS[0].q); S.opts=QS[0].o; return; }
  if (q==='Почему я плохо сплю?'){
    let t = st ? `За последние ${st.n} ночей ваш индекс сна — ${st.score} из 100.` : 'Пока мало данных.';
    if (st && st.lat>25) t += ` Вы засыпаете в среднем за ${Math.round(st.lat)} минут — это дольше нормы, обычно мысли и экран перед сном.`;
    if (st && st.spread>30) t += ` Время отбоя скачет на ±${st.spread} минут: организму сложно понять, когда пора спать.`;
    const bad = ins.filter(i=>i.d<0);
    if (bad.length) t += `\n\nЧто мешает чаще всего:\n` + bad.map(i=>`• ${i.f} — минус ${dec(Math.abs(i.d))} балла к качеству`).join('\n');
    bot(t);
  } else if (q==='Как быстрее засыпать?'){
    bot('• Ложитесь, только когда клонит в сон, и вставайте в одно и то же время.\n• За час до сна — тусклый свет и без рабочих чатов.\n• В кровати — дыхание 4-7-8: вдох на 4, пауза на 7, выдох на 8.\n• Не уснули за 20 минут — встаньте и вернитесь, когда снова потянет в сон. Это основа метода КПТ-И.');
  } else if (q==='Составь мне план сна'){
    S.assess={step:0,a:{}}; bot(QS[0].q); S.opts=QS[0].o; return;
  } else if (q==='Что делать, если проснулся ночью?'){
    bot('• Не смотрите на часы — подсчёт оставшихся часов будит сильнее.\n• Не берите телефон: яркий экран и лента окончательно прогоняют сон.\n• Сделайте несколько циклов дыхания 4-7-8.\n• Если через 20 минут не уснули — встаньте, посидите при тусклом свете со скучной книгой и вернитесь, когда снова начнёт клонить.');
  } else if (q==='Сколько мне нужно спать?'){
    bot(`Большинству взрослых нужно 7–9 часов.${st?` Сейчас вы спите в среднем ${fmtDur(st.sleep)}.`:''} Лучший ориентир — как вы себя чувствуете днём: если просыпаетесь без будильника и бодры до вечера, значит, хватает.`);
  } else if (q==='Можно выпить снотворное?'){
    bot('Советовать лекарства я не могу — их подбирает только врач, с учётом вашего здоровья. Могу помочь с привычками и режимом, а если бессонница держится дольше месяца, лучше записаться к терапевту или сомнологу.');
  }
}
function onOpt(v){
  me(v);
  const A = S.assess;
  if (A.step>=0 && A.step<QS.length){
    A.a[QS[A.step].k] = v; A.step++;
    if (A.step<QS.length){ queue(()=>{ bot(QS[A.step].q); S.opts=QS[A.step].o; }); }
    else { queue(()=>{ bot(plan()); S.opts=CHIPS; }); }
  } else if (v === 'Составь мне план сна' || v === 'Пройти опрос заново'){ queue(()=>{ S.assess={step:0,a:{}}; bot('Задам 4 коротких вопроса — и соберу план вместе с вашим дневником.'); bot(QS[0].q); S.opts=QS[0].o; }); }
  else if (LIVE() && !aiBusyChat){ S.opts = null; save(); aiBusyChat = true; questDone('ask'); aiChat().finally(()=>{ aiBusyChat = false; renderChat(); }); return; }
  else queue(()=>{ answerQuick(v); if (!(S.assess.step>=0 && S.assess.step<QS.length)) S.opts=CHIPS; });
  S.opts = null; save(); renderChat();
}

let bToken = 0;
let bTimer = null;
function breath(kind){

  $('#layer').innerHTML = `<div class="breath" role="dialog" aria-label="Дыхательное упражнение">

  </div>`;
  const orb = $('#orb'); let r=0, p=0, left=0;

    if (tok !== bToken || !document.getElementById('b-phase')){ clearInterval(bTimer); return; }

    if (r>=rounds){ $('#b-phase').textContent='Готово. Теперь можно спать'; $('#b-count').textContent=''; orb.style.setProperty('--d','2s'); orb.style.setProperty('--s','.55'); clearInterval(bTimer); return; }

  }

  setTimeout(()=>{ if (tok !== bToken) return; phase(); bTimer = setInterval(()=>{ if (tok !== bToken || !document.getElementById('b-count')) return clearInterval(bTimer); left--; if (left<=0){ p++; phase(); } else $('#b-count').textContent=left; },1000); }, 900);

  aiBusyChat = true; aiChat().finally(()=>{ aiBusyChat = false; renderChat(); setTimeout(()=>{ const ci = document.getElementById('chat-in'); if (ci && current==='chat') try{ ci.focus({preventScroll:true}); }catch(e){} }, 50); });
});

document.querySelectorAll('#sky .stars').forEach(box=>{ const n = box.classList.contains('many') ? 34 : 9, maxY = box.classList.contains('many') ? 250 : 110; for (let i=0;i<n;i++){ const st = document.createElement('i'); st.style.left = (Math.random()*100)+'%'; st.style.top = (Math.random()*maxY)+'px'; st.style.animationDelay = (Math.random()*4)+'s'; st.style.animationDuration = (3+Math.random()*4)+'s'; if (Math.random()<.2){ st.style.width = st.style.height = '3px'; } box.appendChild(st); } });
let lastPhase = null, lastDay = TODAY;
function applyPhase(){ const ph = curPhase(); document.documentElement.dataset.phase = ph; if (tg){ try { tg.setHeaderColor && tg.setHeaderColor('#0E131D'); } catch(e){} } return ph; }
lastPhase = applyPhase();
setInterval(()=>{ const today = iso(tzNow()); if (today !== TODAY){ TODAY = today; } const ph = applyPhase(); if (ph !== lastPhase || today !== lastDay){ lastPhase = ph; lastDay = today; const ae = document.activeElement; if (!document.querySelector('#layer > *') && current==='sleep' && !(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) renderSleep(); } }, 30000);
initRoom();
refreshBadge(); go('sleep');
if (!S.onboarded) openOnb();
/* deep links from the bot: ?open=calm | diary | stats | learn | chat | room | winddown */
(function(){ let o = ''; try { o = new URLSearchParams(location.search).get('open') || ''; } catch(e){}
  if (!o || !S.onboarded) return;
  if (o==='calm') openCalm(); else if (o==='winddown') openWinddown(); else if (o==='plus') paywall(); else if (o==='report'){ go('stats'); openAiReport(); }
  else if (['sleep','diary','stats','learn','chat','room'].includes(o)) go(o); })();
/* restore from Telegram cloud when this device has no local data yet (new phone, reinstall) */
(function(){ let hasLocal = false; try { hasLocal = !!localStorage.getItem(KEY); } catch(e){}
  if (!hasLocal || !S.entries.length) cloudLoad(data=>{ if (!data || !data.entries || !data.entries.length) return;
    S = Object.assign(freshState(), data); TZ = S.tz || ''; TODAY = iso(tzNow());
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
    const onb = document.getElementById('onb'); if (onb && S.onboarded) onb.remove();
    refreshBadge(); go(current); toast('Данные восстановлены из облака Телеграма'); });
})();
/* Telegram back button closes overlays; light haptics on taps */
if (tg && tg.BackButton && tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')){
  const syncBack = () => { const open = document.querySelector('#layer > *') || document.getElementById('onb'); try { open ? tg.BackButton.show() : tg.BackButton.hide(); } catch(e){} };
  new MutationObserver(syncBack).observe(document.body, {childList:true, subtree:false});
  new MutationObserver(syncBack).observe(document.getElementById('layer'), {childList:true});
  tg.BackButton.onClick(()=>{
    const L = document.getElementById('layer');
    const btn = L.querySelector('[data-closesheet],[data-closewd],[data-closecalm],[data-closerep],[data-stopbreath]');
    if (btn) return btn.click();
    if (L.firstElementChild){ L.innerHTML = ''; return syncBack(); }
    const onb = document.getElementById('onb'); if (onb){ const back = onb.querySelector('[data-onbback]'); if (back && O.i > 0) back.click(); }
  });
  syncBack();
}
if (tg && tg.HapticFeedback){ document.addEventListener('click', e=>{ const b = e.target.closest('button'); if (!b) return; try {
  if (b.matches('.mascot,[data-savediary],[data-buy],[data-worry],[data-goodnight]')) tg.HapticFeedback.impactOccurred('medium'); else tg.HapticFeedback.selectionChanged(); } catch(x){} }, true); }
document.addEventListener('click', e=>{ const a = e.target.closest('a[data-privacy]'); if (a && tg && tg.openLink){ e.preventDefault(); try { tg.openLink(new URL('privacy.html', location.href).href); } catch(x){ location.href = 'privacy.html'; } } });
refreshMe();
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState === 'visible') refreshMe(); });
})();
</script>
